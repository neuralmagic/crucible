#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-BOUNDARY-FAILURE"
title = "Boundary failures are ledgered by name"
kind = "normative"
status = "active"

[content]
text = """
A failure at the controller-engine boundary (a refused request, a rejected contract version, an undecodable reply, a render that errors) MUST be recorded on the issue or run ledger with the request kind, the controller and engine contract versions, and the engine's own error text. It MUST NOT be reduced to a generic "produced no result" outcome.

A boundary failure MUST NOT be retried automatically: the same request against the same engine cannot succeed, and a retry hides the fault behind a moving timestamp.

Rationale: the motivating failure was visible only to someone who read the raw ledger event; the summary said nothing, and the item stayed in its initial state as if never attempted."""
