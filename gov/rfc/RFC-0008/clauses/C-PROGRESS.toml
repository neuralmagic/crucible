#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PROGRESS"
title = "Target progress"
kind = "normative"
status = "active"

[content]
text = """
For every target kind, the controller MUST describe a target's static graph and a target run's progress in one shape: a list of nodes and a list of edges between them. A node MUST carry an identifier unique within the graph, a label, and a status; and MAY carry a group, start and end times, a kind-specific detail, and a link. The status MUST be one of the task statuses a Crucible run's graph uses, so that one renderer draws every kind, and each kind MUST state its mapping.

For a "playbook" target, nodes MUST be the target run's tasks and their mapped instances, with the run's own statuses, and a node's link MUST name the target run and task. For a "github_workflow" target, nodes MUST be its jobs, with matrix legs of one job in one group and edges from needs; a node's detail MUST list the job's steps with their status and times, and its link MUST be the job's page on GitHub. A "gitlab_pipeline" target's nodes are those [[RFC-0008:C-GITLAB-PIPELINE]] gives it, and a "tekton" target's those [[RFC-0008:C-TEKTON]] gives it. Before dispatch, the static graph from the lock MUST be served with every node pending.

A watch's progress MUST be one group per matched run, named by the run's name and holding that run's nodes, with no edges between groups. Before the first run matches, the controller MUST serve the static graph the lock records for each expected name, with every node pending, and MUST replace each with the matched run's own nodes.

The controller MUST serve the progress of every target run a run dispatched or watched to whoever may read the calling run, and MUST NOT serve to a reader of the calling run anything else of a playbook target run that the reader may not read under [[RFC-0003:C-READ-SCOPING]]: such a node MUST show its label and status and no link. The controller MUST bound a progress graph at 512 nodes and say how many it left out."""
