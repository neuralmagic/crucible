#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PLAYBOOK-PARAMS"
title = "Workflow parameters and launch schema"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A workflow source MAY declare its parameters in a params block. The block MUST be the source's first statement and MUST be a literal: it MUST NOT contain a call, an interpolation, or a reference to a variable. The engine MUST be able to read the block without evaluating the source, so that an unevaluated or untrusted source can still be introspected. Only the source a run names may declare parameters; a loaded library MUST NOT.

A declared parameter MUST have one of these types: string, integer, number, boolean, or list of strings. A declaration MAY carry a human-readable description, a default, a required flag, and a value constraint: a pattern for a string, a minimum and maximum for a numeric type, or an enumerated choice set. A string declaration MAY also carry a multiline flag, which tells a launch form to take the value in a text area and MUST NOT change how the value binds; the engine MUST reject it on any other type. A parameter declared required MUST NOT also declare a default.

A string declaration MAY instead take its choices from a task output: choices_from names a task in the same workflow and a field that task promises in emits as a list. The engine MUST reject a choices_from whose task is absent or mapped, whose field the task does not promise as a list, or that is declared together with an enumerated choice set. The engine MUST NOT check a value against choices_from, which has no list at compile time. A controller that serves a launch form MUST offer the field's value from the latest passing attempt of that task among the playbook's runs, MUST refuse a launch value outside that list, and MUST record with the launch which run's list it validated against. A list over 256 entries, or with an entry over 256 characters, MUST NOT be offered. Before any such run exists, the parameter takes any value its type and pattern admit.

The task a choices_from names, and every task it depends on, MUST compile to the same tasks whatever values the parameters are bound to; the engine MUST reject a source whose producer tasks differ between two compiles that bind every parameter differently. The launch value choices.refresh = true MUST compile only those tasks, MUST NOT be supplied with any declared parameter, and MUST give their command tasks an empty params entry. A controller MUST accept it as a launch's only value when the playbook declares a choices_from parameter, and a passing run of it refreshes the offered list as any other run does.

A choices_from MAY add keyed_by, naming another declared string parameter: the field is then promised as an object from that parameter's values to lists, and a controller MUST offer, and validate against, the list for the value supplied for that parameter, and no choices when it has none. A string declaration MAY set placeholder_from = {task, field, keyed_by}, whose field is promised as an object from the keyed parameter's values to one string; a controller MAY show the string for the supplied key in the empty input and MUST NOT submit or validate against it. The engine MUST reject a keyed_by that names an undeclared, non-string, or the same parameter, and a keyed field the task does not promise as an object. Each keyed object MUST NOT be offered beyond 256 keys of at most 256 characters, nor a value beyond the list or string bounds above.

A declaration with choices or choices_from MAY set allow_other, which makes the list suggestions: the engine and the controller MUST then accept a value outside it that the type and pattern admit. allow_other on a declaration with neither MUST be a compile error.

Parameter values MUST be bound during compilation. The compiled graph MUST contain no unresolved parameter reference, so that the rendered graph shows exactly what will run and the frozen artifact remains fully static. Where a manifest field admits a parameter, it MUST be substituted at the same point, so that no parameter survives into execution unresolved.

A declared parameter name MUST NOT contain a dot; a params block that declares one MUST be a compile error. A supplied name that contains a dot is a launch setting, not a parameter: <task>.<setting> sets an agent setting on one agent task, *.<setting> on every agent task, and repo.ref the ref [[RFC-0001:C-MANIFEST]] checks the repository out at. The agent settings are harness, model, and effort. A task-addressed name splits at its last dot, since a task name may contain one, and ref is valid only as repo.ref. A manifest that declares no workflow MUST refuse every launch setting.

Every launch setting MUST be checked before any task is dispatched, and each refusal MUST name the address. The engine MUST refuse a setting the manifest's [agent.overrides] does not allow; a harness or effort that does not parse, read without regard to case; a model that is not a model name, or that is not listed when [agent.overrides].models lists any; a ref [[RFC-0001:C-MANIFEST]] refuses; and an address naming a task that does not exist, runs no agent, or shares a session, because a session runs under one agent config. A model name is 1 to 200 characters of letters, digits, and . _ - : / @ [ ], and does not begin with "-".

An agent setting resolves, from highest to lowest, to the launch's <task>.<setting>, the task's own value, including one its session supplies, the launch's *.<setting>, and then the run's defaults. The engine MUST write launch values onto the compiled tasks, so that the rendered graph and the definition digest [[RFC-0002:C-PLAYBOOK-RERUN]] records cover them. A launch that sets every task's harness or model both through the run's own agent options and through *.<setting> MUST be refused.

A required parameter with no supplied value MUST be a compile error, and the engine MUST NOT dispatch any task of that plan. A supplied value violating its declared constraint MUST be rejected before compilation.

The engine MUST emit the declared block as a JSON Schema document on request, so that one declaration serves command-line validation, ask validation, and a generated launch form.

A parameter value that did not originate inside the pack MUST reach an agent prompt only inside a region the prompt marks as external input not to be followed as instruction. An inspector reading the rendered prompt MUST be able to tell which spans came from outside the pack. Such a value MUST NOT be convertible to plain text: an operation that would yield it as a string without its marking, such as str(), repr(), %-formatting, .format(), or a string method, MUST be a compile error, and the text any such conversion yields MUST NOT contain the value. A value whose span in a prompt carries the text of either marker MUST be a compile error rather than rewritten, so that an attempt to open or close a region is reported to whoever launched the run.

The engine MUST give every command and evaluate task the values bound at compilation under the reserved input "params": an object with one entry per declared parameter, under the parameter's name, carrying the bound value with its declared type, and an empty object where the source declares no parameters. This lets a command read a value from outside the pack as data, without the pack building it into a command line. A resumed run MUST give each task the same values the interrupted run bound. The engine MUST NOT give "params" to an agent task, whose parameter values reach it only through the marked prompt regions above, and MUST reject a plan that names a dependency "params", as [[RFC-0002:C-SETTLED-JOIN]] requires for every reserved input."""
