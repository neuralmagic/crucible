#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-CASCADE-SHAPE"
title = "What the graph expresses"
kind = "informative"
status = "active"
since = "0.1.0"

[content]
text = """
A cascade's graph says what runs before what, and what must pass before what runs. It does not say how many times anything runs. The graph is dispatched once, so a task that must retry, poll, or converge does that inside its own execution, where the author's command or the agent's own turn loop owns the repetition. A repair loop is therefore one task, not an edge back into the graph, and the engine never sees the iteration at all.

This is also why an item set discovered at run time cannot become new nodes. The only two things a run can do with such a set are handle it inside one task or emit it as asks under [[RFC-0002:C-ASKS]], and which one is right turns on whether the items deserve their own budget, isolation, and verdict.

The payoff is that the compiled graph is fully renderable before any spend and identical across runs of the same pack at the same parameters: the node set and the edges between them do not depend on what a task finds. Which of those nodes are dispatched still varies. [[RFC-0002:C-CASCADE-LANE]] leaves tasks undispatched after an early completion, and [[RFC-0002:C-CASCADE-CAPS]] truncates the plan or skips an advisory subtree when a capability is unavailable. Dispatch order among concurrent tasks is not fixed either. What is fixed is the shape. [[RFC-0002:C-CASCADE-LANE]] states the once-per-run obligation; this clause records what follows from it for an author deciding where to put a loop."""
