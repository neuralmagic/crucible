#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-FAILURE-EVIDENCE"
title = "Declared evidence from measured failures"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A non-mapped command or evaluate task MAY set `capture_on_failure = true` only when it declares at least one path through `emits_files` and requests isolated execution. The engine MUST reject the option on every other task kind, on a mapped task, without isolation, or when `emits_files` is empty.

When such a task settles with a measured failure after its command finishes, the engine MUST capture the complete declared file set before discarding the isolated workspace. The confinement, atomic-publication, file-mode, and total-size obligations of [[RFC-0002:C-TASK-FILES]] MUST apply identically to files captured on success and files captured on measured failure. If any declared file is absent or invalid, the engine MUST publish none of the set and MUST include the capture problem in the task failure diagnostic.

The engine MUST NOT capture files under this option when a task reports a skip or settles with a transport failure. Files from an unsuccessful transport attempt MUST NOT enter a captured set.

Capturing declared failure evidence MUST NOT change the task failing status, make its JSON result a passing dependency output, satisfy an ordinary dependency, retain undeclared workspace changes, or contribute a commit to run git memory. Publication MUST exclude workspace changes made by the failing task.

An epilogue task MUST receive every complete captured file set from settled main-graph tasks under `inputs/<producer>/<declared-path>`, including sets captured from measured failures. Captured failure files MUST NOT be staged into an ordinary main-graph task. If an engine-owned captured set is incomplete when staged, the consumer MUST fail closed rather than receive a partial set.

Captured sets MUST remain in engine-owned run state independently of workspace and git memory. Reconstructing a runner over the same run state MUST preserve availability of a complete captured set to an unsettled epilogue without reconstructing undeclared producer workspace state.

The admitted-plan event MUST carry whether each task requested failure capture. Readers of events written before this field existed MUST interpret its absence as false."""
