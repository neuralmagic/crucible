#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-REPORTS"
title = "Typed workflow reports"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A playbook MAY declare an engine-owned report task with a destination kind and an optional result task. The result task MUST be a task in the same graph and MUST settle before the report task is dispatched. The report task MUST receive only that task's declared JSON output, never its prompt, stdout, workspace, undeclared files, or credentials.

A report result MUST be bounded before delivery. The operator MUST configure a maximum encoded size, and exceeding it MUST fail the report task without truncation. Values MUST retain their JSON types through the report snapshot. A report renderer MUST escape text for its destination and MUST NOT interpret result values as destination-native payload fragments.

The Slack destination MUST support a structured card projection containing an engine-authored header, run verdict and cost, the selected result fields, bounded task status context, and a controller-owned run link. The engine MUST construct the destination-native payload; a pack MUST NOT supply raw Slack blocks, attachments, webhook URLs, channels, actions, or identifiers. Delivery failure MUST settle a required report task as failing.

The persisted session result for a report task MUST record whether delivery succeeded but MUST NOT persist the webhook credential. An observer MUST be able to distinguish a delivered report, a rendering failure, an oversized result, and a destination failure."""
