#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-REPORTS"
title = "Typed workflow reports"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A playbook MAY declare an engine-owned report task with a destination kind and an optional result task selector. The selected task MUST be a task in the same graph. Selection MUST NOT create a dependency from the report epilogue to the main graph. After the main graph settles, the report task MUST receive only the selected task's declared JSON output when that task passed, never its prompt, stdout, workspace, undeclared files, or credentials. When the selected task did not pass, the report MUST retain the selected task's terminal status without projecting partial output.

A selected report result MUST be bounded before delivery. The operator MUST configure a maximum encoded size, and exceeding it MUST fail the report task without truncation. Values MUST retain their JSON types through the report snapshot. A report renderer MUST escape text for its destination and MUST NOT interpret result values as destination-native payload fragments.

The Slack destination MUST support a structured card projection containing an engine-authored header, run verdict and cost, the selected result fields, bounded task status context, and a controller-owned run link. The engine MUST construct the destination-native payload; a pack MUST NOT supply raw Slack blocks, attachments, webhook URLs, channels, actions, or identifiers.

The Google Docs destination MUST append one plain-text report section to an existing operator-configured document.

The Google Sheets destination MUST accept one `.csv` or `.tsv` file declared by the selected result task and captured under RFC-0002:C-TASK-FILES. The engine MUST reject an absent file selector, a selector without a result task, a path the selected task did not declare, and every other file extension. After the main graph settles, the report task MUST parse the captured file as comma-separated or tab-separated records according to its extension and append the complete rectangular matrix to the existing operator-configured spreadsheet range. Malformed input and rows with unequal field counts MUST fail the report task without a partial write. Every cell MUST be written as literal data rather than interpreted as a formula.

A pack MUST NOT supply document identifiers, spreadsheet identifiers, ranges, formulas, credentials, or user identities. Every destination target, credential, and delegated identity MUST be operator configuration unavailable to workflow tasks. Delivery failure MUST settle a required report task as failing.

The persisted session result for a report task MUST record whether delivery succeeded but MUST NOT persist a destination credential or target identifier. An observer MUST be able to distinguish a delivered report, a rendering failure, an oversized result, malformed tabular input, and a destination failure."""
