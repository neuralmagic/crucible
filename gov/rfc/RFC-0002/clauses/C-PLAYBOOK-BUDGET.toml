#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PLAYBOOK-BUDGET"
title = "Cost and time ceilings"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """

A playbook MUST run under two ceilings supplied by whatever launched it: a total cost ceiling and a total wall-clock ceiling. A playbook source MUST NOT declare either, so that a pack cannot raise a limit its operator set.

The engine MUST refuse to dispatch any task of a playbook for which either ceiling is missing. Unsupervised scheduled work with no stated limit is the failure this rule exists to prevent, so the refusal MUST come before any spend rather than at the first overrun. A run that ends because a ceiling was exhausted MUST name which one in its shutdown outcome.

A task can spend when its attempt asks a model: an agent task, a route a decision model decides, and the scored loop's candidate-producing turn. A revise loop can spend when any task of its body can, because its rounds dispatch as one unit. Every other task cannot spend, and the engine MUST NOT hold it to the cost ceiling.

The engine MUST check the cost ceiling before every dispatch of a task that can spend, and each lane of a fan-out, whether an instance of a mapped task or a member of a batch of isolated tasks, is a dispatch of its own: the engine MUST admit lanes one at a time as each starts, never a batch as a whole. The ceiling is reached once the run's settled spend, plus what attempts still in flight have reported spending so far, reaches it. Once the ceiling refuses a lane, the engine MUST refuse every later lane that can spend, even where a figure in flight later settles lower. The engine MUST run at most a bounded number of lanes of one dispatch at once, so that what lanes already in flight can carry past the ceiling is bounded by that width. A lane or task not dispatched because the cost ceiling was reached MUST settle blocked, naming the cost ceiling.

The engine MUST NOT terminate an attempt already in flight on cost grounds, so attempts in flight when the ceiling is reached MAY carry the total past it. Once the ceiling refuses a dispatch, or an attempt carries the total past it, the run MUST be invalid, and the engine MUST block every further dispatch and retry of a task that can spend. It MUST NOT block a task that cannot spend: such a task MUST still dispatch under its own join and retry its transport failures, so the run collects and reports the work it already paid for.

The engine MUST terminate every attempt in flight when the wall-clock ceiling is reached, MUST invalidate the run, and MUST block all further dispatch and retries. This is deliberately the opposite of the cost rule, and a reader who pattern-matches from one to the other will get it wrong: an attempt's cost is settled only once it finishes, so killing that attempt would spend the money and learn nothing, whereas a run past its window is over no matter what any task is still doing. The wall-clock ceiling therefore blocks every task, including one that cannot spend.

Separately from the run's ceilings, every attempt of every task MUST execute under a bounded wall-clock deadline: a hung task spends nothing, so the cost ceiling cannot bound it. The run's wall-clock ceiling is both the operator's default deadline and its maximum. A task that declares no limit is bounded by the ceiling alone; a task MAY declare a shorter per-attempt limit, and a declared limit exceeding the ceiling MUST be rejected before any task is dispatched. An attempt's deadline is its task's declared limit counted from the start of that attempt, or the instant the run's wall-clock ceiling falls if that is earlier, so a deadline never extends an attempt past the ceiling. Attempts dispatched together MUST each run under their own deadline.

When an attempt reaches its task's own limit, the engine MUST terminate the attempt together with every process it started and MUST settle it as a measured failure whose note names the limit. That failure propagates like any other failure rather than ending the run directly. The engine MUST NOT retry it: rerunning an attempt that exceeded its limit repeats the time it spent without adding evidence. An attempt the run's wall-clock ceiling terminates instead settles as a failure naming the ceiling, and the run ends on that ceiling as the paragraph above requires.

A wall-clock ceiling reached while an epilogue task is in flight MUST terminate that attempt. Either ceiling reached during the epilogue MUST block further dispatch as the paragraphs above require, and MUST NOT change a verdict already determined by the main graph. The epilogue exists to report on the run, so letting its own spend rewrite the run's verdict would defeat it.

Every ceiling and deadline in force MUST be discoverable by the pack author and the operator before a run starts."""
