#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-REVISE-LOOP"
title = "A reviewer's bounded send-back"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A task MAY declare revise, naming one or more tasks, together with max_rounds. The named tasks are the targets and the declaring task is their reviewer; the targets and the reviewer together are the loop's body. The engine MUST reject revise without max_rounds and max_rounds without revise, MUST reject max_rounds outside 2 to 5 inclusive, MUST reject a revise that names no task or names one task twice, and MUST reject a target from which the reviewer is not reachable through dependencies. The engine MUST reject a body that omits a task lying on a dependency path between two body tasks: a round re-runs the body, and a task between two body tasks outside it would read a result a later round replaces. The engine MUST reject a loop in which any body task is anything other than an agent, command, or evaluate task, or maps over a list. The engine MUST reject a task that is in two bodies, and a reviewer that is itself a target: loops do not nest or chain. The engine MUST reject revise in every workflow type other than "playbook". The name "revision" is a reserved input under [[RFC-0002:C-SETTLED-JOIN]], and the engine MUST reject a dependency named after it.

The engine MUST NOT dispatch the loop's first round until every dependency outside the body of every body task has settled, and MUST NOT dispatch a task outside the body that depends on a body task until every body task has settled under its own name. Where any body task cannot run on the substrate, the engine MUST dispatch the body's tasks as tasks outside any loop and MUST settle each one that cannot run as [[RFC-0002:C-PLAYBOOK-CAPS]] requires.

A round dispatches the body's tasks one at a time in dependency order, each under its own join and when against this round's results for the body and the settled results outside it. A body task whose join those results do not satisfy MUST settle blocked for that round, and one whose when excludes it MUST settle not taken for that round, as any task would. The engine MUST NOT begin another round unless the reviewer's round settled failing and fewer than max_rounds rounds have run, and MUST begin one when both hold and no ceiling is exhausted. A reviewer round that passed, skipped, transport-failed, was blocked, or was not taken ends the loop. Before every round after the first, and before every dispatch within a round that the task's join and when would allow, the engine MUST check the cost and wall-clock ceilings. An exhausted ceiling ends the loop and halts the run as it would halt any dispatch. Within a round, a body task not dispatched for it MUST settle blocked on that ceiling; a loop ended by a ceiling between rounds leaves each body task settled as its last round did. An epilogue loop outlives a required failure in the main graph as any epilogue task does.

From the second round on, the engine MUST give each target the reserved input "revision", carrying under "round" the round about to run, under "max_rounds" the declared bound, under "reviewer" the reviewer's name, and under "review" the reviewer's previous round as the entry [[RFC-0002:C-SETTLED-JOIN]] defines for a settled dependency. Where the engine holds a complete file set captured from that failing reviewer round, it MUST stage that set into each target under the reviewer's name, and the entry's staged-file flag MUST say whether it did. The engine MUST NOT give "revision" to a target in the first round or to the reviewer in any round. A body task that declares a session MUST resume that session in every round.

Each round of each body task MUST produce one session row named after the task followed by "[round-N]", written as that round settles and carrying that round's status, output, note, and spend. A first round that dispatched no body task MUST produce no round rows. Once the loop ends, each body task MUST produce one row under its own name carrying its last round's status, output, note, blocked reason, and transport cause, and the sum of every round's spend. A round row MUST NOT affect the verdict or halt the run; the rows under the tasks' own names do, exactly as [[RFC-0002:C-PLAYBOOK-LANE]] states for any task. A dependent of any body task MUST read the last round's output and captured files.

Every round settles its work as any task does. A passing round's workspace changes MUST be committed to the run's git memory and a failing round's MUST be discarded, as [[RFC-0002:C-PLAYBOOK-LANE]] requires, so a later round runs on top of every earlier passing round. A round's captured file set MUST replace the set its task published in an earlier round under the rules of [[RFC-0002:C-TASK-FILES]] and [[RFC-0002:C-SETTLED-JOIN]].

The admitted-plan event MUST carry a reviewer's targets under "revise", as a string when it names one and as a list in the order it names them when it names several, and its bound under "max_rounds", and MUST carry an empty string and zero for every other task, so a reader that predates chains reads every plan without one."""
