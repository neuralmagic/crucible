#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-ASKS"
title = "Work emission"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A playbook MAY emit asks: descriptions of work for another run to perform. An ask MUST carry a key, the workflow it names, and that workflow's parameter values. An ask's parameter values MUST satisfy the named workflow's declared schema, and the receiving orchestrator MUST reject an ask that does not.

The key MUST be supplied by the emitter and MUST be stable across runs for the same underlying item, so that a receiving orchestrator can recognize a repeat without interpreting the ask's contents. What counts as the same item is the emitter's judgment and cannot be checked by the engine; the obligation is verified by auditing emitted keys on the session log against what they referred to.

A run MUST NOT dispatch an ask it emitted. Admission belongs to the receiving orchestrator, which owns deduplication, exclusion policy, and rate limits; an emitting run therefore cannot widen its own blast radius.

The number of asks one run may emit MUST be bounded, the bound MUST be operator-configurable and discoverable before a run starts, and reaching it MUST fail the emitting task rather than silently dropping the remainder.

Emitted asks MUST be recorded on the session log, so that what a run proposed is auditable independently of what was admitted.

An ask MUST NOT carry file content. Material a receiving run needs MUST be referenced by published artifact location.

A task MUST declare the workflows it may ask for, and the engine MUST reject such a declaration outside the playbook lane, on any task other than an agent, command, or evaluate task, and on either task of a revise loop under [[RFC-0002:C-REVISE-LOOP]], whose rounds produce drafts the loop may replace. A task emits asks by returning them in its JSON output under the reserved field "asks", as a list of objects each carrying exactly "key", "workflow", and "params". A task MUST NOT declare that field among its outputs, and the engine MUST reject a graph that does.

Only a task that settles passing emits asks. The engine MUST NOT record, count, or act on the asks in the output of a task that settled any other way. The engine MUST check a passing task's asks before that task's work is committed to the run's git memory, and MUST settle the task as a measured failure, retaining its output and not retrying it, when its output carries asks and the task declares no workflow, when the field is not a list, when an ask has any field besides the three, when an ask's key or workflow name is unusable, when an ask names a workflow the task did not declare, when a parameter value is anything other than a string, a number, a boolean, or a list of strings, when one ask's encoded parameters exceed 4096 bytes, or when the task repeats a workflow and key that it or an earlier task of the same run already emitted. The workflow and key together identify an ask, since two workflows asking about one item are two pieces of work.

The bound counts asks across the whole run. The launcher sets it, the engine MUST apply a default when the launcher sets none, and the admitted-plan event MUST state the bound in force alongside each task's declared workflows. A task whose asks would take the run's total past the bound MUST fail as a measured failure, the engine MUST NOT record or count any of its asks, and a later task MUST see the total as it stood before the refused task. Tasks dispatched together meet the bound in declaration order, so which of them fails does not depend on which finished first.

The engine MUST record a passing task's asks as one event on the session log, written before that task's result row, so a reader that has seen the row has seen what the task asked for."""
