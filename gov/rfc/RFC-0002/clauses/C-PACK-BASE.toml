#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PACK-BASE"
title = "Base packs"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A draft version MAY name a base: a pack identified by the content digest of its stored tree. A base digest is available to a subject when at least one registered pack that has not been deleted, that names no base, and that the subject may read under [[RFC-0003:C-READ-SCOPING]] has that digest as its current revision or as one of its prior revisions. A draft version MAY name a base only by a digest that is available to the subject saving it. A pack published from that draft version names the same base. A pack registered from a source repository or imported MUST NOT name a base. The base MUST NOT be expressed as a manifest key.

The composed tree of a pack that names a base is the base tree with the pack's own files, its overlay, placed over it by path; the composed tree of a pack that names no base is its own tree. An overlay file at a path present in the base MUST replace that base file whole, and a base file at a path the overlay does not hold MUST be kept unchanged, so an overlay cannot remove a base file. Composition MUST NOT merge the contents of two files. The controller MUST refuse to save a draft version whose overlay holds a file at a path that is a directory in the base, or a directory at a path that is a file in the base. The overlay MAY replace the manifest or inherit it from the base. Compilation at save, registration, and publication, the extraction of what a pack exposes, and the tree delivered to a run MUST all use the same composed tree, and the engine MUST receive only the composed tree.

The identity of a pack that names no base is its digest. The identity of a pack that names a base is the pair of its base digest and its overlay digest, and it MUST NOT compare equal to a pack that names no base. Two packs that name a base MUST compare equal only when both digests are equal. A published pack built on a base MUST expose both digests wherever it exposes its revision. A launch MUST record the pair of the pack it runs. A standing launch pinned to a pack MUST record that pair. A standing launch that runs a draft's latest saved version MUST NOT record a pair; each launch it creates MUST record the pair of the draft's latest saved version at the time of that firing. A pack MUST keep the base it was saved with: a later revision of the base MUST NOT reach it except through a newly saved draft version that names the new digest.

The controller MUST refuse to save, publish, or launch a pack built on a base whose digest is not available to the subject, and MUST refuse to dispatch an existing launch on the same condition. The subject is the caller for a save, publication, or launch, the launch's owner at dispatch, and the firing subject under [[RFC-0003:C-DECISION]] for a firing; a firing refused this way MUST be handled and audited as a denied firing. The controller MUST decide availability before any other check that depends on the base, and when the base is not available MUST return only one refusal, which names the base digest as given and states that the base is not available. No refusal that depends on the base's content, such as a base that names a base, a path collision, the delivery budget, or a compile error in the composed tree, may be returned to a subject for whom the base is not available. The controller MUST NOT substitute another revision of the base. A share on a pack built on a base MUST NOT confer any action on the base.

Reading a draft version or pack that names a base MUST return its overlay and its pair to any subject with `read` on it. The composed tree, and the set of overlay paths that replace base paths, MUST be returned only to a subject that also has the base available; to any other subject they MUST be withheld as [[RFC-0003:C-READ-SCOPING]] requires. The set of replaced paths MUST be returned in the response to a save made by a subject entitled to it, and MUST be retrievable under the same rule.

The controller MUST keep a base's stored tree, unchanged under its digest, while any draft version, pack, launch, or standing launch records that digest. Deleting or transferring a registered pack that holds the digest MUST NOT remove the stored tree. Keeping the tree MUST NOT make the base available: availability is decided at each save, publication, launch, and dispatch as above.

The controller MUST declare a delivery budget, measured as the size of the delivered tree in the encoding delivered to a run, and MUST make the value retrievable. The controller MUST refuse to save, register, or publish any pack whose composed tree exceeds the delivery budget in force at that time, and MUST refuse to dispatch a launch whose delivered tree exceeds the budget in force at dispatch, with a refusal that names the budget and the size. Limits on file count and per-file size of a draft MUST apply to its overlay, not to the composed tree.

Approval of a pack built on a base is governed by [[RFC-0003:C-APPROVALS]]."""
