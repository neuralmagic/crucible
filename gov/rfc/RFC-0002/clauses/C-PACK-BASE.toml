#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PACK-BASE"
title = "Base packs"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A pack's files are the regular files under its root, excluding any path with a segment named `state`, `.git`, or `workspace`. Files and non-regular entries under an excluded segment are ignored, and a save, registration, or import MUST report the paths it ignored. A pack file's path MUST be relative to the root, use `/` separators, be valid UTF-8, and contain no empty, `.`, or `..` segment and no newline. The controller MUST refuse to save, register, or import a pack that holds a symbolic link or another non-regular file outside an excluded segment. No file mode is part of a pack: every pack file MUST be delivered to a run and published with mode 0755.

A pack's digest MUST be the string `tree1:` followed by the lowercase hex SHA-256 of its tree summary: one line per pack file, in byte-wise order of path, each line the lowercase hex SHA-256 of the file's bytes, two spaces, the path, and a newline. The digest MUST NOT depend on file mode, timestamps, or how the pack is archived, compressed, stored, or delivered. A pack's revision is its digest, and every pin, comparison, and approval of a pack MUST use it.

A launch MUST record the digest of the pack it runs, and dispatch MUST deliver the stored tree under that digest and no other. A standing launch pinned to a pack MUST record that pack's digest. A standing launch that runs a draft's latest saved version MUST NOT record a digest; each launch it creates MUST record the digest of the draft's latest saved version at the time of that firing.

A draft version MAY name a base: a pack identified by its digest. A base digest is available to a subject when at least one registered or imported pack that has not been deleted and that the subject may read under [[RFC-0003:C-READ-SCOPING]] has that digest as its current revision or as one of its prior revisions. A pack registered from a source repository or imported MUST NOT name a base, and a base MUST NOT be expressed in the pack's manifest. The controller MUST refuse to save a draft version whose base digest is not available to the caller, and MUST decide availability before any other check that depends on the base. When the base is not available the controller MUST return only one refusal, which names the base digest as given and states that the base is not available, so that a caller cannot tell a missing base from one it may not read; no refusal that depends on the base's content may be returned instead. The one exception is a replaced digest, which MUST be refused as the migration paragraph of this clause requires.

Saving a draft version that names a base MUST flatten it: the base's files with the overlay's files placed over them by path. An overlay file at a path that is a base file's path MUST replace that file whole, every base file at a path the overlay does not hold MUST be kept unchanged, and contents MUST NOT be merged, so an overlay cannot remove a base file. The controller MUST refuse to save, register, or import a pack, and to save a draft version, in which one file's path followed by `/` is a prefix of another file's path, across the base and the overlay when there is a base. An overlay MAY be empty or MAY equal part of the base; the flattened digest then equals the base's digest. The flattened tree is the pack: its digest is the version's digest, and compilation, exposure extraction, approval, launch, and delivery MUST use the flattened tree and no other.

A draft version saved on a base MUST record as provenance the base digest, the digest of the overlay's files computed as above, every overlay path, and which of those replaced a base path, and MUST return them with the version. A pack registered from that draft version MUST carry and return the same provenance. Provenance digests MUST NOT keep any stored tree. For each registered or imported pack that the requesting subject may read and that holds a version's base digest as a prior revision, the controller MUST report, with the version, that pack and its current revision digest. A pack the subject may not read MUST NOT be reported or counted.

Saving on a base copies the base's files into the pack. A subject that may read the saved pack reads those files, and reading, launching, sharing, or approving the saved pack MUST NOT require any action on the base. The availability check at save is the only authorization applied to the base's content, and a later deletion of the base or loss of access to it MUST NOT affect packs already saved on it.

The controller MUST keep a pack's stored tree, unchanged under its digest, while any draft version, registered or imported pack, launch, or standing launch records that digest. A registered or imported pack records its current revision and every prior revision.

The controller MUST declare a delivery budget, measured as the size in bytes of the gzipped tar the controller delivers as a run's pack ConfigMap, and MUST make the value retrievable. A launch delivered by image volume ([[RFC-0002:C-PACK-PUBLISH]]) is not checked against it at dispatch. The controller MUST refuse to save, register (including by draft publish), or import a pack whose tree exceeds the delivery budget in force at that time, and MUST refuse to dispatch a launch whose delivered tree exceeds the budget in force at dispatch, with a refusal that names the budget and the size. Limits on the file count and per-file size of a draft MUST apply to its overlay, not to the flattened tree.

A digest recorded before this clause took effect MUST be replaced by the digest of the same stored tree, computed after applying this clause's definition of a pack's files, and every pin, approval, base reference, and run record holding it MUST be rewritten to the replacement. Several replaced digests MAY map to one replacement. A stored tree that cannot be converted, because it holds a non-regular file, an invalid path, or a path collision outside an excluded segment, MUST stay recorded under its old digest as unconvertible by every resource that holds it, and every request that would compile, deliver, publish, launch, or use it as a base MUST be refused with a refusal that names the reason. The controller MUST refuse a request that supplies a replaced digest: to a caller who may read some resource that recorded it, with a refusal that names it as superseded and gives its replacement; to any other caller, exactly as for an unknown digest, and as a base with the unavailable-base refusal.

Approval of a pack saved on a base is governed by [[RFC-0003:C-APPROVALS]], and publishing packs to an OCI registry by [[RFC-0002:C-PACK-PUBLISH]]."""
