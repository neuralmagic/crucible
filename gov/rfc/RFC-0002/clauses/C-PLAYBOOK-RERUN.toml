#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PLAYBOOK-RERUN"
title = "Rerunning from a task"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A rerun is a new run of a playbook that names a finished run of the same playbook as its parent and one or more main-graph tasks as its selection. It has its own run id, ceilings, session log, verdict, and publication. The engine MUST refuse a rerun whose parent has not shut down, and one whose selection names a task the current graph does not contain.

The engine MUST rerun every selected task, every task downstream of a selected task, every main-graph task the parent did not settle passing, every main-graph task the parent's graph did not contain, and every epilogue task. Where a rerun task is a member of a revise loop under [[RFC-0002:C-REVISE-LOOP]], the engine MUST rerun every member of that loop. A mapped task is reused or rerun as one node, never per instance. Every other main-graph task is reused.

The engine MUST record, for every task in the graph it admits, a definition digest over the compiled task with its parameters bound and over the definition digests of its dependencies. The engine MUST refuse a rerun in which a reused task's definition digest differs from the digest the parent recorded for it, and MUST name each such task. Editing a task therefore reruns it only when it is selected or downstream of a selection; an edit anywhere else is refused rather than silently reused. The definition covers what the graph declares. A file a task reads from the pack or the workspace is not part of it, and an edit to one MUST NOT by itself refuse a rerun.

A rerun MUST start from the commit its parent's workspace started from, not from the target's current head, and MUST refuse when that commit is unavailable. A checkout holding the same tree is the same start. A workspace with no repository of its own starts from a commit of the pack's injected files alone, so a rerun of one starts from its own. Before dispatching any task, the engine MUST replay onto that commit, in the order the parent settled them, the commits each reused task contributed to the parent's git memory under [[RFC-0002:C-PLAYBOOK-LANE]], and MUST refuse the rerun when any replay fails. Replayed commits are the rerun's git memory, so a rerun publishes them as its own.

The engine MUST treat each reused task's parent result as terminal and MUST feed its output and captured files to dependents exactly as a live execution would, under [[RFC-0002:C-TASK-FILES]] and [[RFC-0002:C-SETTLED-JOIN]]. The engine MUST refuse a rerun when the parent's session log, captured files, or task commits are unavailable, naming what is missing; it MUST NOT reconstruct a reused task's output any other way.

Each reused task MUST appear in the rerun's session log as a settled row marked reused and naming the run that produced it, which for a task the parent itself reused is the run its parent names. Spend recorded for reused rows MUST NOT count against the rerun's ceilings, and MUST be reported apart from the rerun's own spend."""
