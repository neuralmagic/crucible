#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SCOPE"
title = "Scope"
kind = "informative"
status = "active"

[content]
text = """
A cascade is a workflow that runs exactly once and produces no score. It exists for work whose value is the work itself: a skill pipeline, a scheduled chore, a discovery sweep. The optimization loop's propose, apply, measure, and decide protocol does not participate, and no frozen judge is constructed.

[[RFC-0001]] governs the engine's manifest, command, world, transport, wire, and workflow-authoring contracts. This RFC adds the cascade lane on top of them and does not restate their universal rules.

This RFC is contingent. Two of its obligations depend on changes to [[RFC-0001:C-WORKFLOW]] that have not been made: admitting a third workflow type, and treating a task's declared files as output rather than as workspace state that isolation discards. Until those changes land, this RFC cannot reach normative status, because a reader following both documents would find its requirements refused by the one that outranks it.

Fan-out over an item set that is not known until a task has run is expressed as one run per item rather than as graph expansion. The graph stays static and fully renderable before any spend; [[RFC-0002:C-ASKS]] defines the boundary where new work leaves a run."""
