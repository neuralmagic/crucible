#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-WEBHOOK-LIFECYCLE"
title = "Webhook secrets and lifecycle"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = "A webhook's secret MUST be generated by the controller with at least 128 bits of entropy and disclosed once, in the response to the create, replacement, or verifier change that generated it; it MUST NOT be readable after that. Changing the verifier MUST generate a new secret. Replacing the secret is `update` on the webhook and applies to deliveries received after the replacement; the controller MAY accept the previous secret for a declared overlap no longer than a platform maximum. No audit record, delivery record, or retrievable state MUST carry a webhook secret, a hash of it, or any value from which it can be checked; for secret generation and replacement, the audited prior and resulting state is the fact of the change and any declared overlap. Creating a webhook, and changing its verifier, filter, parameter derivation, or rate bound, MUST additionally be decided as an `update` that changes what its standing launch fires under [[RFC-0003:C-DECISION]]. A save whose parameter derivation names a parameter the standing launch's playbook does not declare, or whose expressions do not compile, MUST be refused. A webhook is enabled or disabled; enabling and disabling are `update` on the webhook. A disabled webhook, and a webhook whose standing launch is disabled, MUST NOT record deliveries. A recorded delivery that has not settled when its webhook is disabled or deleted MUST settle failed with that reason. The controller MAY disable a webhook after consecutive failed firings, counting only failures that do not derive from delivery content, and MUST audit that disabling with an actor that names the controller and no principal. Creating, enabling, disabling, and deleting a webhook, and replacing its secret or verifier, MUST be audited under [[RFC-0003:C-AUDIT]]."
