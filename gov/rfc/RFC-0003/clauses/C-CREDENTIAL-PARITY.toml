#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-CREDENTIAL-PARITY"
title = "Credential parity"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = "The decision MUST produce the same answer for the same user regardless of which credential proves them, provided the credential proves the same groups. An API key MUST act with the owner's group memberships as refreshed within the group refresh window that governs sessions; a key whose owner's groups cannot be refreshed within that window MUST act as the user principal plus directly listed team memberships until they can. Revoking a team membership or a group MUST take effect for every credential of the affected user within one group refresh window. The identity probe MUST state whether the presenting credential proves groups."
