#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-APPROVALS"
title = "Approvers as policy"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
Who may approve a pack import, a scope, or a draft graduation MUST be decided by the `approve` action through [[RFC-0003:C-DECISION]], with approver sets expressed as team roles or policy rules rather than a separate allowlist. An approval recorded from an external system (a source-forge review) MUST be attributed to a controller identity through a verified account link: an association between the external login and a controller user that the user established while authenticated to both. An external login with no verified link MUST NOT approve. Any existing approver allowlist or forge-association fallback MUST be honoured only through an explicit policy rule that names it, so that removing the rule removes the path.

An approval of a draft graduation MUST record the draft and the digest it approves ([[RFC-0002:C-PACK-BASE]]) and MUST apply to every version of that draft whose digest equals the approved digest, and to no other. An approval recorded for any other resource, a base included, MUST NOT be treated as an approval of it, even when the digests are equal. The approval request for a pack saved on a base MUST show the base digest, each registered or imported pack the approver may read under [[RFC-0003:C-READ-SCOPING]] that has that digest as its current revision, every overlay path, and which of those paths replaced a base path. A scope approval binds the exposure extracted from the pack and is not changed by this paragraph."""
