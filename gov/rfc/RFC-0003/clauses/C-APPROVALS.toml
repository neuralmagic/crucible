#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-APPROVALS"
title = "Approvers as policy"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
Who may approve a pack import, a scope, or a draft graduation MUST be decided by the `approve` action through [[RFC-0003:C-DECISION]], with approver sets expressed as team roles or policy rules rather than a separate allowlist. An approval recorded from an external system (a source-forge review) MUST be attributed to a controller identity through a verified account link: an association between the external login and a controller user that the user established while authenticated to both. An external login with no verified link MUST NOT approve. Any existing approver allowlist or forge-association fallback MUST be honoured only through an explicit policy rule that names it, so that removing the rule removes the path.

A draft graduation of a pack built on a base ([[RFC-0002:C-PACK-BASE]]) MUST record the pair of its base digest and overlay digest, and MUST apply only to a pack whose two digests both equal the recorded pair. An approval of the pair MUST NOT be treated as an approval of the base alone or of the overlay alone, and an approval of the base MUST NOT be treated as an approval of any pack built on it. A subject to whom the base is not available under [[RFC-0002:C-PACK-BASE]] MUST NOT approve such a graduation. The approval request MUST list every overlay path that replaces a base path, and is shown to each subject as [[RFC-0002:C-PACK-BASE]] scopes reads of base-derived content. A scope approval binds the exposure extracted from the composed tree and is not changed by this paragraph."""
