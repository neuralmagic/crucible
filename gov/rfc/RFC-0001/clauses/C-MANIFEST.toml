#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-MANIFEST"
title = "Manifest schema and validation"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
The engine must read exactly one manifest per run. Default path is ./crucible.toml, overridable via --manifest.

The manifest directory (dirname of the manifest file) must anchor all config-relative paths.

Required fields: [repo], when present, must contain exactly one of url or path. [repo] may be omitted only by a manifest whose [workflow].type is playbook; every other manifest must carry it. When [judge] is present, [judge].measure_cmd and [judge].direction are required. When [judge] is absent, the run is a task lane.

[repo].ref, when present, names the branch, tag, or commit the repository is cloned at. It MUST be a valid git ref name, short (main, feature/x, v1.2) or fully qualified (refs/heads/main), or a full commit id, and MUST NOT begin with "-", which git would read as an option. A ref that breaks either rule MUST be rejected as a manifest error naming it. A ref a launch supplies is held to the same rules.

When a ref is set, the engine MUST fetch it from the clone source and check it out detached, so that a short or fully qualified branch or tag, a refs/pull/ ref, and a full commit id all resolve. A commit the clone already holds need not be fetched. A ref that cannot be fetched or checked out MUST fail setup naming the ref; the engine MUST NOT run on any other commit, and MUST remove the clone so that no later run reuses it.

[repo.overrides].refs lists the refs a launch may check out instead of [repo].ref ([[RFC-0002:C-PLAYBOOK-PARAMS]]). Each entry is a glob over branch and tag short names: * matches within one /-separated segment and ** across segments, and a branch and a tag of the same short name match alike. An entry that is empty, begins with "-", is not a valid glob, or begins with "refs/" other than "refs/pull/" MUST be rejected at manifest validation. A refs/pull/ ref MUST match only an entry that begins with "refs/pull/", so that a broad entry never admits code from a fork. [repo.overrides] MUST be rejected at manifest validation when [repo] has neither url nor path, and beside [workspace].setup_cmd, which replaces the clone.

A launched ref MUST be refused before anything is cloned when [repo.overrides].refs lists no entry, when no entry matches it, or when the manifest lives inside the workspace it targets, since the checked-out ref would then supply its own manifest. A full commit id is matched once cloned instead: the engine MUST keep it only when a branch or tag of the fresh clone that an entry matches contains it, and otherwise MUST refuse the run and remove the clone. A fresh run with a launched ref MUST refuse a workspace that already exists. A resumed run and a rerun start from the commit their run recorded ([[RFC-0002:C-PLAYBOOK-RESUME]], [[RFC-0002:C-PLAYBOOK-RERUN]]), not from the ref.

[agent.overrides].allow lists the agent settings a launch may set on the workflow's agent tasks ([[RFC-0002:C-PLAYBOOK-PARAMS]]). Its entries MUST be drawn from harness, model, and effort; any other MUST be rejected at manifest validation. [agent.overrides].models, when non-empty, lists the models a launch may name; it MUST be rejected unless allow lists model, and each entry MUST be a model name as [[RFC-0002:C-PLAYBOOK-PARAMS]] defines one. With no allow entries a launch sets no agent setting. A composite manifest MUST reject [agent.overrides].

[workspace].inject entries take two forms. A table names src (manifest-relative), dst (workspace-relative), and frozen (default true). A string is shorthand for a table whose dst equals its src and whose frozen is true. A string that names a directory or contains a glob metacharacter must expand to every regular file it matches under the manifest directory, in sorted path order, each becoming its own frozen entry with dst equal to its manifest-relative path. Expansion must not escape the manifest directory, and a string that matches no file must be rejected as a manifest error naming the string.

[world] with no commands must produce GitWorld. Any command given must produce CommandWorld, which layers domain commands on top of git memory.

[judge.selftest], if present, must require both good_cmd and bad_cmd; runs must be >= 1.

[search], if present with wide > 0, must require approaches.len() >= wide and policy_k in 1..=wide.

Unknown manifest keys must be rejected as errors.

Frozen loading: when the manifest lives inside the workspace it targets, the engine must parse it from the workspace's pristine base commit, not the current working tree. Before any base commit exists (the very first run), the engine must hard-warn and trust the working tree for that run only."""
