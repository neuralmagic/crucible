#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-WORKFLOW"
title = "Scope-authored workflow DSL"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A scoped pack may include workflow.star beside crucible.toml. It is authoring syntax; scope must compile it to [[workflow.task]] manifest IR before validation and again before freeze. The generated TOML is the runtime authority.

The DSL must accept: assignments, scalar values, lists, dictionaries, list concatenation, conditional expressions, comprehensions, iteration, user-defined functions, and direct calls to the constructors its lane defines. Every lane has agent, command, evaluate, skill, session, prompt_file, schema_file, param, and workflow. A skill task is an agent task whose prompt is assembled rather than written: the instructions come from a SKILL.md the pack ships under a directory the task names, and the arguments the invocation supplies are rendered after them. It is a naming and reuse construct only, and must not widen what a task may reach. The playbook and custom lanes add route, noul, and choice, and accept when on any task; [[RFC-0001:C-ROUTE]] states their rules. The scored lanes add propose, apply, measure, grade, decide, top_k, and default_autoresearch. A constructor outside the declared lane must not be in scope: naming one must be an unknown-name error at its own location rather than a validation failure after the graph compiles, and a did-you-mean must never offer one. The lane must therefore be readable from the source before the source is evaluated. Starlark's own pure builtins may be reached; a builtin that reaches the filesystem, a process, the network, the clock, or a source of randomness must be absent. The DSL must not provide mutation of frozen values, filesystem access other than prompt_file(), schema_file(), and load(), processes, network, time, or randomness.

An author-supplied source is untrusted input. Compilation must terminate, and no source may abort the process, exhaust the native stack, or panic: a source that exceeds a bound must fail compilation with a diagnostic the scope pipeline can hand back to its author, because that channel is what turns a bad pack into a recoverable round rather than a dead run. The obligation covers the compiler's own traversal of the source as well as the evaluation of it. Parsing, module resolution, argument marshalling, and value allocation must each be bounded in depth and in size, iteration and recursion must execute under a bound enforced during evaluation, and every bound must be checked before the work it bounds is done rather than after.

load() must resolve only within the pack directory and must refuse absolute paths, parent traversal, and any path reaching a file outside the pack through a link. The number of modules loaded and their total size must be bounded, and each bound must be counted as a module is admitted rather than once it returns. Loaded content must reach the generated TOML, which remains the runtime authority and the hashed artifact.

Topology is authorable; authority is not. A workflow must declare type = "autoresearch", "custom", or "playbook". An autoresearch workflow's result must be a decide task sourced from a frozen measure or authored grade, with apply and propose ancestors. A custom workflow has no autoresearch-shape requirement. A playbook workflow runs its graph once and carries no judge; [[RFC-0002]] states the rules particular to it. Universal DAG, source-typing, and operation-capability rules apply to all three.

Tasks marked isolated = True must run concurrently in disposable worktrees; their workspace state must be discarded. Only a task's declared output continues through the graph: its JSON output, and any files it declared under emits_files.

A task may declare emits, the fields its JSON output promises, as a list of field names or as a dictionary from field name to type. A type is one of "string", "integer", "number", "boolean", "list", "object", a non-empty list of distinct labels, which declares a string equal to one of them, or a schema_file(), which declares a value its JSON Schema admits. Labels must be identifiers, as route labels are. "integer" admits a number with no fractional part, and "number" admits any number. Both forms must reach the generated TOML unchanged, and the plan_admitted event must carry each declared field with its type when it has one, and each declared file with its schema when it has one.

schema_file() must resolve only within the pack directory under the confinement load() has, and its size must be bounded and charged to the same budget as prompt_file(). The file must be a JSON Schema of draft 2020-12 that declares no other $schema and references nothing outside itself; anything else must be a compile error at the call. The engine must not fetch a referenced schema. The schema's content, not its path, must be compiled into the plan, so editing it changes the plan. On the wire a schema is its JSON text. An empty or absent emits declares nothing and is never checked.

A passing attempt whose output lacks a declared field, or holds a declared field whose value is not of its declared type, must settle as a measured failure at the producing task: it must not be retried, its note must name the field, and the output must be kept as the evidence. For a schema, the note must give the instance path and message of each of the first few errors and must not repeat the refused value.

An agent task may declare repair = N, with N from 0 to an engine ceiling of 3; a command or evaluate task must refuse it at compile time, because running it again produces the same output. When an attempt of a task with repair would pass but its output lacks a declared field, holds one that is not of its type, or lacks or breaks a declared file ([[RFC-0002:C-TASK-FILES]]), the engine must resume the same agent conversation, give it every such note, masked as above, and check the result again, at most N times, before the attempt settles. A repair must not start a new conversation, must run within the attempt's deadline, must count its cost toward the attempt and the run's budget, and must not start once the attempt has spent what the run had left when it was dispatched. A repair is not a retry: the attempt count does not change, and when repairs run out the attempt settles as the measured failure it would have been without them. Each mapped instance repairs on its own. Each repair turn must be recorded on the task's result with its round, its cost, and the notes it was given. A task that settles itself skipped or failed owes nothing.

Validation must check the declared types against every consumer that reads a field, before dispatch. A task mapped over producer.field must name a field its producer declares, and when that field is typed, a "list". A top_k dependency, a grade score source or tiebreak, and a thresholded evaluate that declare emits must declare score, and when it is typed, a "number" or an "integer". An output-decided route reading a question from a source whose emits types that question's field must find every value of the type answerable under [[RFC-0001:C-ROUTE]]: a label list whose every label is one of the question's labels or "uncertain", or, for a noul, "boolean". Any other type, "string" included, must be rejected, because it promises nothing about which label arrives. A field declared by a schema must satisfy each consumer exactly, as far as the schema can be read without evaluating it. Its values are bounded by its const, its enum, or a boolean type, read through local $ref and allOf. Mapped over, its top-level type must be "array" and every item must provably be a string, because a mapped instance is named by its item: the items and every prefixItems entry must have type "string", or a const or enum of strings only, directly, through a local $ref or an allOf member, or in every branch of an anyOf or oneOf; a schema that declares no items, or whose items admit anything else, must be rejected naming what it found. Read as a score, its top-level type must be "number" or "integer" and any const or enum must hold numbers only. Read by an output-decided route, its bounded values must all be answers the question accepts, a boolean answering "yes" or "no"; a schema that bounds nothing must be rejected as "string" is. A schema whose top-level type is absent or a list must be rejected wherever a consumer needs a type.

When an output-decided route's source bounds a question's field to finitely many answers, by a label list, "boolean", or a schema as above, a when that names a label the source can never give must be rejected as never answered, naming the label, the source, and the answers it can give. Such a label need not be routed, and otherwise must expand only to labels the source can give. A field declared without a type is checked for presence only.

session = "name" must preserve one logical agent conversation across dependency-ordered tasks and loop iterations. Tasks sharing a session must not be isolated and must be dependency-ordered.

A required task must not depend, through a path of "all"-join edges, on a task declared advisory. Such a graph asserts both that a failure is tolerable and that the work it gates must pass, and no execution of it can produce an honest verdict. Validation must reject it before dispatch, naming both tasks. A required task joining "passed" or "settled" is exempt: it declares that it runs on whatever settled.

A list of tasks must be accepted wherever a list of task names is, so an author never wraps one to pass it. A task constructed in workflow.star but omitted from workflow(tasks = ...) must be a compile error.

Compile errors must carry file:line:col and a did-you-mean suggestion for unknown functions, kwargs, variables, and session names. A diagnostic about a named argument must locate that argument rather than the whole call, and a suggestion must draw on the names the source itself binds as well as on the DSL's own."""
