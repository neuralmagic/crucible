#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-COMMANDS"
title = "Command protocol"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
Every command (measure_cmd, apply_cmd, snapshot_cmd, restore_cmd, setup_cmd) must be a string executed via sh -c with cwd = the agent workspace, except setup_cmd which must run with cwd = manifest dir (the workspace does not exist yet).

measure_cmd, apply_cmd, snapshot_cmd, restore_cmd, and every workflow command and evaluate task must run with an environment holding only PATH, HOME, LANG, and TMPDIR as the engine has them, the variables the engine sets for that command (the scores and token this clause names, and a workflow task's name and inputs), and the variables its manifest table declares: [judge].env for measure_cmd, [world].env for apply_cmd, snapshot_cmd, and restore_cmd, and [workflow].env for workflow command and evaluate tasks. Nothing else of the engine's environment may reach them, since a command can be a script the agent was able to edit. PATH is inherited so a command may be a bare installed tool or a workspace-relative script. A declared entry must be an environment variable name (a letter or underscore followed by letters, digits, and underscores), optionally followed by a single ?. A name without ? is required: the engine must refuse the run before any of these commands runs, naming every required variable its environment does not set. A name followed by ? is optional: the command must receive it when the engine's environment sets it and must run without it when it does not, and its absence must not refuse the run. An entry with ? anywhere but once at its end, and a name a table declares both required and optional, must fail the manifest's parse, naming the entry. setup_cmd runs with the engine's environment.

measure_cmd is required when [judge] is present. It must inject CRUCIBLE_BASELINE_SCORE, CRUCIBLE_BASELINE_TOTAL, and CRUCIBLE_BEST_SCORE into env when those values are available (absent on baseline measurement). The engine must read the last stdout line that starts with { and parse it as JSON with fields: valid (bool, required), score (number or null), tiebreak (number, optional), solved (bool, optional, default false), note (string, optional), detail (object, optional). A nonzero exit code must force the reading to valid:false regardless of stdout.

apply_cmd, if present, must run after the agent turn and before measure. Nonzero exit must treat the iteration as an invalid candidate (discard).

snapshot_cmd must emit one opaque token on its last stdout line. restore_cmd must receive the token in CRUCIBLE_TOKEN env. snapshot_cmd and restore_cmd must come as a pair.

setup_cmd default when omitted: with [repo] present the engine must git clone [repo] into [workspace].dir and git checkout [ref]; with [repo] absent the engine must create [workspace].dir empty. In every case the engine must then apply [workspace].inject, and the workspace must end up a git repo whose base commit holds the injected files."""
