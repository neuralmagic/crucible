#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-INFERENCE"
title = "Injected inference bindings"
kind = "normative"
status = "active"
since = "0.2.0"

[content]
text = """
An orchestrator tells the engine where models are reached through one document, the resolved inference bindings, carried as JSON in the environment variable CRUCIBLE_INFERENCE. The document is defined once, in the contract crate both sides compile, and carries a wire version. The engine must reject a document whose version it does not know or that has an unknown field, before it clones, spends, or writes anything, with an error that names the version or the field. Absent or empty, the run has no bindings.

A binding states what the inference is for and how it is reached: a role, a protocol, a model, optionally a URL, and optionally the name of the environment variable that holds its credential. An absent URL means the protocol's own service address; a decision binding must name one, because system_one has none. The document must never carry a credential's value. The roles are agent, the model an agent turn thinks with, and decision, the model a route task asks under [[RFC-0001:C-ROUTE]]. The protocols are messages, chat_completions, responses, and system_one. A document must hold at most one binding per role. An agent binding must speak messages, chat_completions, or responses; a decision binding must speak system_one. A URL must be absolute http or https, name a host, and carry no credentials. A credential variable name must be a valid environment variable name and must not be CRUCIBLE_INFERENCE. The engine must reject a document that breaks any of these, naming the binding.

A binding says nothing about delivery. The engine derives it from the role's consumer. Where the engine's own process is the client, as for a decision, the engine must use the binding directly and the credential must not leave the engine. Where the client runs inside a sandbox, as an agent harness does, the engine relays: it must project the binding into the sandbox under the names that client reads, and must add the binding's endpoint to the sandbox's egress policy. Those names are the engine's concern and are not part of this contract; an orchestrator must not be required to know them.

The systemone capability of [[RFC-0002:C-PLAYBOOK-CAPS]] is available exactly when the document holds a decision binding. A named credential variable that is unset or empty when its binding is first used must fail that use with an error naming the variable, and must not be treated as an unauthenticated endpoint.

An agent binding is the whole answer for agent turns. Its model is the run's model, over the manifest's agent defaults and over a model the launch named; a task that names its own model keeps it. Its protocol constrains the harness: the harness the launch or the manifest selected is kept when it is a client of that protocol, and otherwise the engine must select the harness that is. Its credential takes the place of any credential the pack's manifest selects, in every authentication mode that manifest names. When an agent binding is present the engine must not consult the process's ambient inference variables. The engine must log each harness, model, or credential a binding replaces. An agent binding with no credential variable authenticates with the deployment's ambient credentials, as a run with no agent binding does. A run with no agent binding reaches its model the way its manifest and the process's ambient environment say, which is how an operator's own shell runs one."""
