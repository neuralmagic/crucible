#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-ROUTE-EACH"
title = "Per-element routes"
kind = "normative"
status = "active"
since = "0.2.0"

[content]
text = """
A route task may declare over = producer.field with max_fanout, under the rules for over in [[RFC-0001:C-WORKFLOW]]: the field must be a list of strings, and the route's instance for an element is named by that element's item, its key. A mapped route decides once per element. Each element's decision is one request to the decision model, transport retries aside, or one read for an output-decided route, and its instance settles on its own: its output is that element's decision in the form [[RFC-0001:C-ROUTE]] defines for a route, and an element that fails or transport-fails must not change the decision recorded for any other element. The engine must check the run's cost and wall-clock ceilings before each element's request as it does before any dispatch, and an element not yet asked when a ceiling is exhausted must settle blocked.

Two tasks are aligned when both declare over naming the same producer and the same field. Every edge from a task to a dependency aligned with it is read per element, whatever kind of task either is. Across such an edge the dependent must not expand until the dependency has settled as a node, and must then expand whatever the node's status, unless dispatch has stopped for another reason. Its instance for an element must receive the dependency's instance for the same key in place of the node: under "all" or "passed" that instance's output under the dependency's name, and under "settled" that instance's entry as [[RFC-0002:C-SETTLED-JOIN]] defines it, with no per_instance mapping. The instance must apply its join to that instance's status in place of the node's, and must read an absent instance as blocked. An instance joining "all" on an aligned dependency whose instance for the same key settled not taken therefore settles not taken, so an untaken element is untaken to the leaves of its aligned chain as [[RFC-0001:C-ROUTE]] requires of a branch.

The state sent for an element must be the route's dependency inputs, read per element across aligned edges, with the element's key added under the reserved key "item". A mapped route must not depend on a task named "item", and validation must reject one that does.

Any mapped task, a route or not, may declare keyed, a list of producer.field references. Each must name a field declared by one of the task's dependencies that is not mapped, and where the declaration types it, as "object" or by a schema whose top-level type is "object"; validation must reject any other, naming the reference, and must reject keyed on a task that does not declare over. For each keyed field, the inputs an instance receives, and for a route the state it sends, must carry in place of the whole field only the field's entry under the instance's key, read from the producer's output whatever the task's join; the producer's other fields are unchanged. A keyed value that is not an object at run time must fail every instance, naming the field, and an absent entry must fail that instance, naming the key and the field. keyed must reach the generated TOML, and the admitted-plan event must carry each task's keyed references as a list of "producer.field" strings, empty for a task that declares none, so a reader can draw which edges are narrowed.

An output-decided route that declares over reads each element's answers from its source per element. Where the source is aligned with the route, the answers are read from the source's instance for the element, under the rules [[RFC-0001:C-ROUTE]] states for a source's output. Otherwise the source must not be mapped, and its output must carry, under each question id, an object keyed by element key whose entry for the element is the answer under those rules; validation must reject a source whose emits types a question's field as anything but "object" or an object schema, and an absent entry must fail that element.

A when that names a mapped route must be declared by a task aligned with that route. Validation must reject a when on a mapped route declared by a task that is not mapped, or that maps over a different list, naming both references. Such a when is evaluated per element: the dependent's instance for an element applies the rules of [[RFC-0001:C-ROUTE]] to the route's instance for the same key, so it settles not taken, without dispatch and without spend, when that element's resolved label is not among the labels the when lists, and the instances for other elements are unaffected. The rules of [[RFC-0001:C-ROUTE]] for drop, otherwise, and label coverage apply to a mapped route's questions unchanged. Several tasks aligned with one mapped route may each declare a when on the same question, and so partition the elements among them by answer. A mapped route may itself declare a when on an aligned route, so it is asked only about the elements that route's answer leaves to it. A when on a route that does not declare over, declared by a mapped task, is evaluated once for the node under [[RFC-0001:C-ROUTE]].

A mapped task's instance that settled not taken must not count as failed. A mapped node with no instances must settle passing. Otherwise it must settle not taken when every instance was not taken, passing when every instance passed or was not taken, and failing otherwise. Its folded output must carry the number of instances not taken beside the numbers that passed and failed, and must carry no output for an instance not taken. The task-result event's fan-out summary must carry the same count under not_taken; a reader that predates it reads a summary without it as zero.

Each element's decision is its instance's recorded output, and an instance settled not taken is terminal. On resume, under [[RFC-0002:C-PLAYBOOK-RESUME]], the engine must fold both, must not ask again for an element that has a recorded decision, and must ask only for the elements that have none."""
