#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-WIRE"
title = "Session wire format"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
The NDJSON session log (state/session.jsonl) must keep its existing event kinds (start/phase/row/budget/summary/finished) and field names unchanged. The objective label must be written under the JSON key "gate" (now carrying a free-text label). This must not be renamed (keeps --resume, the remote viewer, and published S3 runs loading).

Additive event kinds:
- identity: the run's RunIdentity, emitted once at setup and again on --resume.
- shutdown: { outcome, reason }, emitted exactly once as the last line of every run (after finished/summary). outcome must be one of finished/solved/budget/complete/stopped/escalated/stalled/suspended/error. suspended means the run stopped at an approval gate intending to be continued by a later process, and is the one outcome a consumer must not treat as terminal. finished means the graph or the loop ran out of work; complete means a task declared there was no work left to do and dispatch stopped short of that, the unscored counterpart of solved. The outcome says how dispatch stopped, not whether the run succeeded. A dead stream with no shutdown line means the pod died mid-run.
- agent_session: { session, action, turn }, emitted before a persistent agent turn. Must not contain the provider cursor or native transcript content.
- approval_wait: { handle, trace_id, mode }, emitted when the loop reads a pending-provisioning marker, and when a playbook opens an approval gate. It may additionally carry task, naming the gate task; source, describing what the gate named as able to resolve it; and park, saying whether the run intends to wait in place or suspend. Every approval_wait must be closed by an approval_resolved except on stop-while-parked, suspension, and process death.
- approval_resolved: { outcome, reason } with outcome one of granted/denied/timeout. It may additionally carry trace_id, naming which open wait it closes; by, the deciding identity where the source supplied one; and source, naming what produced the decision. A reader must match a resolution to its wait by trace_id where one is present, because a run may hold more than one gate open at a time.
- plan_admitted: { plan_version, reason, budget_usd, tasks }, emitted once after the graph is admitted and before any dispatch. Each task carries its name, kind, dependencies, session, needs, required flag, join, and stage. This is the consumer's route to the graph, so no gate label has to encode it. A consumer computing a verdict must skip tasks whose stage is epilogue, which is why the field is on the wire rather than inferable.
- asks_emitted: { task, asks }, emitted once per task that emitted any, as that task settles. Each ask carries an emitter-supplied key, the workflow it names, and that workflow's parameter values. The key must be rejected on decode, not only on construction, so the wire is where the key rules are enforced rather than a way around them.
- recovery: { class, iter, detail }, emitted once per --resume.

Every event may carry ts, the Unix time at which it was written. A reader must not require it: logs written before the field existed do not carry it, and a reader that computes elapsed or waiting time from it must tolerate its absence rather than refuse the log.

A reader must not refuse a session log because it carries an event kind it does not know. It must skip that event and continue. This is what lets a newer writer's log be read by an older consumer at all: the event kinds above are additive by design, and a reader that failed on the first unfamiliar one would make every addition a breaking change.

RunIdentity is the comparability key: two runs' scores are comparable only if it matches. It must be a hash-of-hashes over: repo URL/path + pristine base commit SHA, frozen manifest text hash, inject content+destination hashes, measure_cmd, and direction."""
