[[changelog]]
version = "0.2.0"
date = "2026-08-22"
notes = "Admit the playbook lane"
added = [
    "route, noul, choice constructors and the when predicate; not-taken terminal status (C-ROUTE)",
    "a route decides from a model or, deterministically, from a dependency's output",
    "injected inference bindings, one typed document for every model the engine or its sandboxes reach (C-INFERENCE)",
    "otherwise, resolved by the compiler to the answers no other task lists",
    "typed emits: a field may declare its JSON type or labels, checked at run time at the producer and at compile time against over, score readers, and output-decided routes (C-WORKFLOW)",
    "schema_file(): a field may declare a JSON Schema (2020-12) read from the pack; its content is compiled into the plan and consumers read its top-level type (C-WORKFLOW)",
    "repair = N on agent tasks: a passing turn whose output breaks its declaration resumes the same conversation with the masked notes, within the attempt's deadline and the run's budget (C-WORKFLOW)",
    "schema-typed fields meet each consumer exactly: string items for over, numeric enums for scores, bounded answers for routes; a when label a typed source can never give is refused (C-WORKFLOW)",
    'a route may be human-decided: needs = "human", governed by RFC-0002 (C-ROUTE); session log gains decision_wait (C-WIRE)',
    "a route may map over a list and decide each element on its own; a task reads a dependency mapped over the same list per element, a when on a mapped route is read per element, and an instance not taken does not fail its fan-out (C-ROUTE-EACH)",
    "keyed: a mapped task may narrow an object field of an unmapped dependency to its own element's entry, and the admitted-plan event carries it (C-ROUTE-EACH)",
    "score questions: ordered levels answered by a per-level distribution and recorded with an engine-computed expected position; asked natively where the decision API has an ordered question and as a choice where it has none (C-ROUTE-SCORE)",
    "a route may put declared JSON files of its dependencies in the decision model's state (C-ROUTE-FILES)",
    "[repo.overrides] and [agent.overrides]: static bounds on the refs and per-task agent settings a launch may change (C-MANIFEST)",
    "a choice may read its options from a dependency's field at run time, per element on a mapped route, bounded at 64 and recorded with the answer; a when on it lists only uncertain or declares otherwise (C-ROUTE-OPTIONS)",
]
changed = [
    "DSL grammar admits dictionaries, conditionals, comprehensions, iteration, user-defined functions, load() and the pure standard library",
    "compilation must be bounded in depth and size and must not abort the process on an author-supplied source",
    "workflow type may be playbook",
    "a task's declared files continue through the graph alongside its JSON output, isolation notwithstanding",
    "a required task may not depend on an advisory one through all-join edges",
    "param joins the enumerated constructors",
    "a route task may declare over (C-ROUTE)",
    "a decision binding is never relayed into a sandbox or task process, so only a route asks the decision model (C-INFERENCE)",
    "shutdown outcome gains complete for a run a task ended with no work left",
    "a named-argument diagnostic must locate the argument, and suggestions draw on source bindings",
    "session log gains the plan_admitted event, so a consumer reads the graph instead of inferring it from a gate label",
    "deps() is removed: depends_on already accepts task values, so the wrapper was ceremony",
    "the declared lane scopes the constructor namespace, so a playbook cannot name or be offered a scored constructor",
    "session log gains asks_emitted, so what a run proposed is auditable apart from what an orchestrator admitted",
    "skill joins the enumerated constructors: an agent task whose prompt is assembled from a shipped SKILL.md and the invocation's arguments",
    "a decision binding may speak decisions, the OpenAI Decisions API, reached at OpenAI's address when it names no URL (C-INFERENCE, C-ROUTE)",
    "the capability a model-decided route needs is decision, not systemone, since it names the role rather than one API (C-ROUTE)",
    "C-ROUTE-EACH: the cost ceiling blocks only an element whose decision asks the decision model (RFC-0002:C-PLAYBOOK-BUDGET)",
    "C-MANIFEST: [repo].ref follows git's ref-name rules and never begins with -; the clone fetches the ref and checks it out detached, and a ref that does not resolve fails setup instead of running on the default branch",
    "C-WORKFLOW: a harness or effort no turn can read is rejected at validation instead of at dispatch",
    "C-ROUTE: an all-join task may declare a dependency optional, so one that settled not taken satisfies the join and gives no input entry; C-WORKFLOW adds the optional constructor",
    "C-MANIFEST: a manifest may declare [variant.<name>] tables; a run that names one reads its top-level tables in place of the base's, and every variant is validated on load",
    "C-COMMANDS: measure_cmd, world hooks, and workflow command and evaluate tasks get PATH, HOME, LANG, TMPDIR, the engine's own variables for them, and what [judge].env, [world].env, or [workflow].env declares; a declared variable the engine lacks refuses the run",
    "C-CAPABILITY-DISCLOSURE: each variable a table declares for host-side commands is disclosed with its table",
    "C-WIRE: task_started { task, attempt, estimate_usd } is an additive event kind a playbook writes before each attempt",
    "C-WIRE: task_agent { task, attempt, event } records each playbook agent attempt's transcript in the session log",
    "C-WIRE: task_started and task_result carry at, when each was written, and task_result's secs is the task's wall time",
    "options are compile-time except a dynamic choice's, which a dependency supplies (C-ROUTE)",
    "C-COMMANDS: a declared NAME? is optional, passed to the command when the engine sets it and left out otherwise; only a required name the engine lacks refuses the run",
    "C-CAPABILITY-DISCLOSURE: an optional declared variable is disclosed with its table and marked optional",
    "C-COMMANDS: a manifest's top-level edition decides what host commands receive; edition 1, the default, inherits the engine's environment, warns, and refuses an env list at parse; edition 2 is the declared allowlist; an edition the engine does not support fails the parse",
    "C-CAPABILITY-DISCLOSURE: under edition 1, each table whose host commands run is disclosed as holding the engine's whole environment",
    "C-COMMANDS: the edition-2 base adds the run's identity, CRUCIBLE_RUN_NAME, CRUCIBLE_RUN_DISPLAY_NAME, and CRUCIBLE_UI_BASE_URL; the pod token and the controller URL reach a command only by declaration",
]

