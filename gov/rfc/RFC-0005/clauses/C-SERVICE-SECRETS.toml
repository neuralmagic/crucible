#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SERVICE-SECRETS"
title = "Service credentials"
kind = "normative"
status = "active"

[content]
text = """
The engine MUST deliver each secret a service names only to that service's process environment, and MUST itself write no secret value into the sandbox, the workspace, a task's inputs, a prompt, the session log, or a captured file.



A service's secrets are credentials under [[RFC-0001:C-CAPABILITY-DISCLOSURE]], held by the service. The resolved disclosure MUST list each service as a relay: the tool, the secrets it draws with the system and scope each declares, the tasks it is exposed to, and the gateway endpoint it adds to their sandboxes. A secret granted at launch is covered only when a service in the manifest names it with equal or broader scope."""
