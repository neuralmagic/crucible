#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0077"
title = "A provider names each model's limits, and the binding carries them to the harness"
status = "accepted"
date = "2026-11-18"
refs = [
    "RFC-0001:C-INFERENCE",
    "ADR-0065",
    "ADR-0066",
]

[content]
context = """
A harness that keeps its own model table needs to be told what a model it does not know can take. Pi's seeded entry declared every model with a 128,000-token context window and a 16,384-token output limit, whatever the model was. On a model with a larger window that wastes context: pi compacts long before it has to. On a self-hosted model with a smaller window it is worse: pi sends requests the endpoint refuses before pi thinks compaction is due.

The engine has no source for these numbers. Its vendor table holds prices for the Anthropic and OpenAI families and nothing about windows, and a model served through a custom provider ([[ADR-0065]]) can be anything. What a model can take depends on who serves it and how, which the operator who registered the provider knows and nobody else does.

The provider registration already carries the provider's model list and its price ([[ADR-0066]]), and the controller already renders the agent binding of [[RFC-0001:C-INFERENCE]] from it."""
decision = """
A provider registration may carry limits per model: a context window and a maximum output, in tokens, keyed by model id. Both are positive and the maximum output is no larger than the window. The controller stores them with the provider and renders the limits of the model a dispatch asks for into the agent binding. A model with no entry, including one a launch names outside the provider's list, renders none. A decision binding never carries limits.

The engine hands the binding's limits to a harness that sets a model's limits in its own configuration. Today that is pi: its seeded model entry and its Vertex extension declare the binding's context window and output limit, and fall back to their former defaults when the binding has none. Claude Code and Codex take a model's limits from their own catalogs and are given nothing.

Limits describe the model. They do not change what a turn costs or what the run's cost ceiling counts."""
consequences = """
- An operator can make pi use the whole window of a large model, and stop it overrunning a small one, by registering the model's limits once on its provider.
- A provider with several models can give each its own limits, which a single provider-wide value could not.
- Nothing is derived: a provider registered without limits behaves as before, so the numbers are right only where someone entered them.
- The limits ride the inference document as an additive field (contract 1.25.0). An engine older than 1.25.0 rejects a document that carries them as an unknown field, so a provider with limits needs dispatch images at 1.25.0 or later. Providers without limits render the document unchanged.
- A run with no agent binding, such as an operator's own shell run, has no way to state limits and keeps the harness defaults."""

[[content.alternatives]]
text = "Carry limits per model on the provider registration and render the dispatched model's into the agent binding"
status = "accepted"
pros = [
    "The operator who serves a model is the one who knows its window.",
    "Follows the path the provider's price already takes, so there is one place to look.",
    "Each model of a provider gets its own limits.",
]
cons = [
    "Someone has to enter the numbers, and nothing checks them against the endpoint.",
    "Older engines refuse a document that carries limits.",
]

[[content.alternatives]]
text = "Keep a table of model limits in the engine, beside the vendor price table"
status = "rejected"
cons = [
    "A self-hosted model's window depends on how it is served, not on its name, so the engine cannot know it.",
    "Every new model needs an engine release.",
]

[[content.alternatives]]
text = "Have a seeded pi extension copy limits from pi's own model catalog when the model id is in it"
status = "rejected"
pros = ["No operator input for models pi already knows."]
cons = [
    "Says nothing about a self-hosted model, which is the case where a wrong window fails requests.",
    "The same model id can have different limits behind different endpoints.",
    "Ties the engine to pi's extension interface for a second purpose.",
]

[[content.alternatives]]
text = "Let the pack's manifest declare limits for its model"
status = "rejected"
cons = [
    "The manifest does not choose the model when a binding is injected, so it would describe a model the run may not use.",
    "Every pack would repeat a fact about the provider.",
]
