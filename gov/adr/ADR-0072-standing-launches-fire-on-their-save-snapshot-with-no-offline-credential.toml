#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0072"
title = "Standing launches fire on their save snapshot, with no offline credential"
status = "proposed"
date = "2026-11-06"
refs = [
    "ADR-0028",
    "ADR-0029",
    "ADR-0035",
]

[content]
context = """
[[ADR-0028]] snapshots a schedule owner's IdP groups at save, with a TTL, so a firing whose scope binds team secrets follows the owner's current membership. [[ADR-0029]] narrows that window: the controller stores each user's offline refresh token, sealed under a chart-mounted key, and re-reads the owner's groups from the issuer before a standing launch fires, before an API key answers, and every few minutes on a live session. A refused refresh downgrades the session to viewer and marks the owner's standing launches as needing sign-in.

In practice the refresh ran only where every piece was configured: an issuer granting `offline_access`, a mounted credential key, a client permitting refresh-token reuse, and a playbook scope with secret bindings. Where any piece was missing, the TTL still applied. A schedule nobody re-saved for seven days parked every firing with "owner snapshot is stale", and the schedules list reported it as enabled. Two production schedules parked this way and stopped silently.

The machinery guards one case: an owner removed from an IdP group whose schedule keeps reaching that group's team secrets. Against that, it carried a credential table that can mint live tokens for every user who has signed in, a per-subject advisory lock, a failure backoff, three refresh paths with different failure semantics, a downgraded session state, a settings panel, and about 2,500 lines of code and tests."""
decision = """
Remove the offline credential and every path that spends it.

- **Standing launches** (schedules, watches, webhooks, one-shots) fire on the owner principal and group snapshot their last save took. The snapshot does not expire. A firing never parks for its owner.
- **Dispatch** keeps the launch's recorded groups that the launcher's `users` row still holds, the groups their last sign-in stamped. A launcher with no `users` row holds none. A user removed from a group loses it on queued and scheduled work at their next sign-in.
- **API keys** answer with the owner's `users` row groups as stamped at their last sign-in.
- **Sessions** keep the groups their login stamped for the session's lifetime. There is no downgraded session.
- The relying party no longer requests `offline_access`. The `user_credentials` table, the credential key (`CONTROLLER_CREDENTIAL_KEY`), the snapshot TTL (`CONTROLLER_SCHEDULE_OWNER_TTL_SECS`), the session refresh interval (`CONTROLLER_SESSION_GROUP_REFRESH_MINUTES`), `/api/credentials/me`, and the owner sign-in and refresh columns on standing launches are dropped. Launches already parked for a stale snapshot close.

This supersedes the offline credential and fire-time refresh sections of [[ADR-0029]] and the snapshot TTL of [[ADR-0028]]. The rest of both stands."""
consequences = """
- Revocation latency for group membership on scheduled and API-key work is bounded by the user's next sign-in, not by a refresh window. Removing a person's `users` row still cuts them off at once, and deleting or re-owning a schedule stops it.
- The controller holds no token that can mint identity for a user who is not present. The credential table and its key leave the threat model.
- A schedule's authorization is whatever its owner saved, until they or someone else re-saves it. Nothing ages out, so nothing parks without a reason an operator can act on.
- Deployments drop the credential key secret and the `offline_access` client scope at their leisure; the controller ignores both.
- If live revocation becomes a requirement, the place to add it is controller-owned team membership, which the firing decision already reads live, not an IdP token cache."""

[[content.alternatives]]
text = "Remove the offline credential; standing launches fire on their save snapshot and dispatch intersects with the last sign-in's groups"
status = "accepted"
pros = [
    "Deletes the credential table, key, refresh paths, TTL, and downgraded sessions.",
    "No silent parking: a schedule fires until someone changes it.",
]
cons = ["Group removal at the IdP reaches scheduled work only at the owner's next sign-in."]

[[content.alternatives]]
text = "Keep the refresh and apply the TTL only to scopes that bind secrets and user owners"
status = "rejected"
pros = ["Smallest change that stops the parks that hit production."]
cons = [
    "Keeps every moving part of the refresh, for a case that was not configured where it parked.",
    "A secret-bound schedule on a deployment without a credential key still parks after seven days.",
]
rejection_reason = "It narrows the failure without removing the machinery that caused it."

[[content.alternatives]]
text = "Raise the TTL, or warn in the schedules view before it expires"
status = "rejected"
pros = ["No code removed."]
cons = ["The schedule still parks, later; the warning is one more thing to ignore."]
rejection_reason = "It moves the cliff instead of removing it."
