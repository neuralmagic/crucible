#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0081"
title = "A call dispatches its target as a separate run through controller-owned target backends"
status = "proposed"
date = "2026-11-25"
refs = [
    "RFC-0008",
    "RFC-0002:C-PLAYBOOK-PARAMS",
    "RFC-0002:C-PLAYBOOK-SHAPE",
    "RFC-0001:C-MANIFEST",
    "ADR-0052",
    "ADR-0055",
    "ADR-0068",
    "ADR-0073",
    "ADR-0075",
]

[content]
context = """
A playbook that needs another playbook's work today has two options. It can copy that playbook's tasks into its own source, so the copy drifts from the original and inherits none of its later fixes. Or a person can launch the second playbook by hand with values copied out of the first run's outputs. Work that ends in a CI pipeline, such as a GitHub Actions workflow that builds, deploys, or releases, has the same gap: an agent or command can call the GitHub API only with a credential handed into its sandbox, and nothing records or draws what it started.

Constraints:

- The compiled graph is static and renderable before any spend ([[RFC-0002:C-PLAYBOOK-SHAPE]]). Parameters bind at compile time ([[RFC-0002:C-PLAYBOOK-PARAMS]]).
- A pack's manifest decides its sandbox, secrets, repository, and agent settings ([[RFC-0001:C-MANIFEST]]). Two packs rarely agree on these.
- A run acts as its own scope ([[ADR-0073]]). Sandboxed agents and task commands receive identity-only, run-bound tokens ([[ADR-0068]], [[ADR-0075]]), never a person's or an installation's credentials.
- The controller already holds a GitHub App, receives verified webhook deliveries ([[ADR-0055]]), and records run history per launch series ([[ADR-0052]]).
- GitHub's dispatch endpoint returns the created run's identifier when asked (since February 2026). A workflow_dispatch workflow takes at most 25 inputs, all strings, booleans, choices, or numbers, and returns no outputs to its caller."""
decision = """
A call task ([[RFC-0008:C-CALL]]) dispatches its target as a separate run and waits for it. The caller and the target meet only at the target's interface: its parameters in, its result out.

**Separate run.** A playbook target runs with its own pack, manifest, sandbox, secrets, dispatch target, and run identity, linked to the calling run and call task as its parent ([[RFC-0008:C-CHILD-RUN]]). It is launched with the authority of the calling run's launch owner, so a call can start nothing its owner could not start by hand.

**Controller-owned backends.** The controller implements each target kind behind five operations: interface, dispatch, progress, outcome, cancel ([[RFC-0008:C-TARGETS]]). The engine asks the controller to dispatch with its own run identity and waits for the outcome. It never contacts the target's system and holds no credential for it. The first kinds are playbook and github_workflow. A GitHub target is dispatched with the App installation's token ([[RFC-0008:C-GITHUB-WORKFLOW]]). A user-supplied token from the secrets registry is left for later.

**Static interface, late values.** A workflow source declares its targets in a literal `calls` block at its top, beside `params`, which the engine and the controller read without evaluating the source ([[RFC-0008:C-TARGETS]]). A lock file in the pack records each target's pin and interface ([[RFC-0008:C-LOCK]]). The engine type-checks every binding against it at compile time, so the graph and the call's output type are known before spend. Values bind when the call becomes ready, from dependency outputs, agent or command alike. A target pinned to something that moves (a draft head, a git ref) is resolved again at dispatch, and a changed interface refuses the call before anything starts.

**Parameters carry data.** json and file parameter types ([[RFC-0008:C-PARAM-TYPES]]) let a target take structured output and files, and serve manual launches equally.

**One progress shape.** Every kind reports its graph as nodes and edges with Crucible task statuses ([[RFC-0008:C-PROGRESS]]), so one renderer draws a playbook child and a GitHub run alike, as a foldable frame inside the caller's graph ([[RFC-0008:C-VIEW]]).

**Waiting and budget.** The caller waits inside the call's execution, with its wall-clock ceiling running. The target run keeps its own ceilings, set by the call's optional budget or by the controller's defaults for a launch of the target, and its spend is not charged to the caller."""
consequences = """
- A playbook reuses another playbook at a pinned revision instead of copying it, and picks up a fix only when its lock is rewritten and the pack re-approved.
- A CI pipeline becomes a typed, drawn, cancellable step of a run, with no GitHub credential in any sandbox.
- A caller pod stays up for as long as its slowest target runs. That is cheap for short targets and wasteful for long ones. Parking the caller and resuming it on the target's outcome is the follow-up.
- A target run's spend is not visible in the caller's cost ceiling. A parent with ten mapped calls can spend ten target budgets. The call's budget and the controller's launch limits are the only bound.
- A GitHub workflow returns data only through an artifact that follows the result.json convention. Existing workflows need a step added before they can return anything.
- A git ref or draft head can change under a locked interface. The call then fails at dispatch, and an author has to rewrite the lock.
- The controller gains a target backend interface, a table of target runs, GitHub polling, and webhook handling for workflow_run and workflow_job. The engine gains one task kind. Clients gain a subgraph renderer for the progress shape."""

[[content.alternatives]]
text = "Compile the target's tasks into the caller's graph as a subgraph of one run"
status = "rejected"
pros = [
    "One pod and one run, so there is no dispatch overhead and no second pod to wait on.",
    "Statuses come from the caller's own session log.",
]
cons = [
    "Two packs' manifests rarely agree on sandbox, secrets, repository, and agent settings, and one run reads one manifest.",
    "The target's own approvals, history, and reruns stop applying to its tasks.",
    "It cannot express an external pipeline at all.",
]
rejection_reason = "A call has to run the target as its owner approved it, under its own manifest, and the same task must reach external pipelines."

[[content.alternatives]]
text = "Let tasks start target runs themselves, through a controller MCP tool or the GitHub API from a command"
status = "rejected"
pros = ["No new task kind or DSL surface."]
cons = [
    "Nothing static: the graph cannot show the target before spend and its output is untyped.",
    "A GitHub token has to be handed into a sandbox or task.",
    "Resume would dispatch again, since nothing records the target run before the task ends.",
]
rejection_reason = "It gives up the static graph, typed outputs, and credential boundary the call exists to keep."

[[content.alternatives]]
text = "Fire and forget: dispatch the target and settle the call at once"
status = "rejected"
pros = ["The caller pod does not wait."]
cons = ["The caller cannot use the target's result or branch on its outcome."]
rejection_reason = "Returning the target's result to the caller is the point of a call. A launch trigger already covers starting a run without waiting."

[[content.alternatives]]
text = "Park the caller and resume it when the target ends"
status = "considered"
pros = [
    "No pod is held while a long target runs.",
    "OpenShell is adding suspend and restore, so a waiting caller's sandbox could be suspended and restored when the target ends, instead of the engine parking and resuming from its session log.",
]
cons = ["Needs a park state, a controller-side resume trigger, and resume of a run with work in flight, none of which exists for this path yet."]
rejection_reason = "Deferred. Waiting in the pod is enough for the first targets, and the handle recorded before waiting makes parking a later change that does not alter the contract. Revisit once OpenShell suspend and restore can hold a waiting caller."

[[content.alternatives]]
text = "Dispatch GitHub workflows with a token from the secrets registry"
status = "considered"
pros = ["Works on a repository the App is not installed on."]
cons = ["Another credential kind to bind, scope, and rotate per target."]
rejection_reason = "Deferred. The App installation covers the repositories in use now, and a token source fits behind the same backend later."

[[content.alternatives]]
text = "Find the dispatched GitHub run by listing recent runs after a 204"
status = "rejected"
cons = ["Races with any other dispatch of the same workflow and ref."]
rejection_reason = "GitHub now returns the run identifier from the dispatch call."

[[content.alternatives]]
text = "Draw each target kind with its own view"
status = "rejected"
pros = ["Each view can show everything its system knows."]
cons = ["Every new kind needs client work, and the caller's graph cannot embed it the same way."]
rejection_reason = "One node-and-edge shape with Crucible statuses lets one renderer draw every kind; kind-specific detail rides on the node."

[[content.alternatives]]
text = "A call dispatches its target as a separate run through controller-owned backends, typed by a pinned interface lock"
status = "accepted"
pros = [
    "The target runs as its owner approved it.",
    "Types and the target's graph are known before spend.",
    "No target credential enters a run, and new kinds are a controller change only.",
]
cons = ["A waiting caller pod, a lock to maintain, and spend outside the caller's ceiling."]

[[content.alternatives]]
text = "Declare call targets in the manifest's [calls] table"
status = "rejected"
pros = ["Beside the other declarations of what a pack reaches outside it: sandboxes, secrets, egress."]
cons = ["A call names a target defined in another file, so reading a workflow needs two files open."]
rejection_reason = "A literal calls block in the workflow source is read without evaluation just as the manifest is, and keeps a call and its target in one file."

[[content.alternatives]]
text = "Declare each target inline in call(), with the controller compiling once to collect targets and again to type-check"
status = "rejected"
pros = ["The target sits on the call that uses it."]
cons = [
    "The controller must evaluate the source to learn its targets, then compile again with the lock, and the two compiles must agree.",
    "A target argument computed from a parameter or a task output could not be pinned, so it needs its own refusal.",
]
rejection_reason = "Two-pass compilation for one declaration is more machinery than a literal block at the top of the source."
