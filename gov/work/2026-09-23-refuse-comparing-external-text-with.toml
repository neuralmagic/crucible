#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-23-001"
title = "Refuse comparing external text with =="
status = "queue"
created = "2026-09-23"
refs = ["RFC-0002:C-PLAYBOOK-PARAMS"]

[content]
description = """ExternalText keeps starlark's default equality, which is pointer identity, so `param("mode") == "fast"` is always False for a supplied value and `param("mode") in ["a", "b"]` never matches. Nothing leaks, but a pack that branches on a supplied string silently takes the wrong branch. Refuse equality (and so `in`) on external text with an error that points at an enumerated param or a defaulted value, or define equality on the joined text if a use case needs it. Found while implementing [[WI-2026-08-23-003]]; see [[ADR-0050]]."""

[[content.acceptance_criteria]]
text = "comparing external text with == or in is a compile error that says what to use instead, with a test for each operator"
status = "pending"
category = "fixed"
