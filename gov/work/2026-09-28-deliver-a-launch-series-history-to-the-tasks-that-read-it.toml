#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-28-003"
title = "Deliver a launch series' history to the tasks that read it"
status = "done"
created = "2026-09-28"
started = "2026-09-28"
completed = "2026-09-28"
refs = [
    "RFC-0002:C-RUN-HISTORY",
    "ADR-0052",
    "RFC-0001:C-WIRE",
]

[content]
description = """Implement the engine side of [[RFC-0002:C-RUN-HISTORY]]: a workflow names a history record task, a task declares how many prior records it reads, and the engine builds the reserved "history" input from records the orchestrator supplies at launch. Per [[ADR-0052]], the engine trims to each task's depth, so the orchestrator never compiles the pack."""

[[content.acceptance_criteria]]
text = "`workflow()` accepts a history record task; a mapped record task, and a record task or history depth outside a playbook, are refused"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "agent, skill, command, and evaluate accept `history` as a depth from 1 to 30, and other values are refused"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the engine reads supplied records from a documented launch input and refuses a malformed document before dispatch"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = 'a task with a depth receives "history" as `{records, dropped}`: the most recent `depth` supplied records, ordered oldest first by end time; a run with no supplied history gets an empty list and zero'
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "records within a task's depth over the operator-configured size limit are dropped whole from the oldest end and counted in `dropped`; `crucible check` shows the limit"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "history reaches an agent prompt only inside the marked external-input region"
status = "done"
category = "security"

[[content.acceptance_criteria]]
text = 'a plan with a dependency named "history" is refused at compile time'
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the session log records the run's history entry: the record task's name, status, and declared output, with null status and output when it never settled"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "plan_admitted carries `history_record` and `history_depth`, and the contract version moves"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the DSL reference and playbook docs document history"
status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "a revise target or reviewer named as the record task records its final result under its own name, not a round row"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "an epilogue record task records its result on a run whose main graph failed"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "a playbook naming no record task records an entry with an empty name and null status and output"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the engine adds no field to a record beyond those the orchestrator supplied"
status = "done"
category = "security"
