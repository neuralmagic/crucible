#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-29-001"
title = "Act as a team from the owner context"
status = "done"
created = "2026-09-29"
started = "2026-09-29"
completed = "2026-09-29"
refs = [
    "RFC-0003:C-ACT-AS",
    "RFC-0003:C-PRINCIPALS",
    "RFC-0003:C-TEAM-UX",
]

[content]
description = "The masthead owner context filters lists but leaves the server answering as the caller, so choosing a team shows the caller's own entitlements, lanes, and reads rather than the team's. Implement acting as a team under RFC-0003:C-ACT-AS: the client names the chosen team on every request, and the controller narrows the subject to that team principal while the actor stays the caller. Also mark which user members of a team have signed in, since view-as needs a stamped sign-in and a never-signed-in member previously failed silently."
notes = ["EventSource cannot send custom headers, so the SSE streams (/api/events/stream, run live views) answer as the caller even while the UI acts as a team."]

[[content.acceptance_criteria]]
text = "A request that names a team the caller holds is decided with that team principal as the only subject, at the lesser of the caller's role and maintainer, while audit rows keep the caller as actor and record the team as subject."
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "A request that names a team the caller does not hold, or names a non-team principal, is refused with 403 and never answered as the caller."
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "whoami while acting as a team reports the team being acted as, the team's entitlements and role, and still lists every team the caller may act as."
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "Choosing a team in the masthead owner context sends it on every request, resets the query cache, and shows which team is being acted as; choosing the caller or all sends nothing."
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "A team's user members report whether they have signed in, and the team page disables view-as for members who have not, instead of failing silently."
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "Every bound route refuses an unheld or non-team act-as header, including routes whose handler never resolves the caller, and secret audit rows carry the team as subject."
status = "done"
category = "added"
