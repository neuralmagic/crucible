#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-22-001"
title = "Say what required means on a report task"
status = "queue"
created = "2026-09-22"
refs = [
    "RFC-0002:C-REPORTS",
    "RFC-0002:C-PLAYBOOK-LANE",
]

[content]
description = """
A report task is an epilogue, and C-PLAYBOOK-LANE says an epilogue task must not change the verdict. The engine follows that: examples/playbook's required publish-report fails locally (no report destination) and the run still reports `verdict: valid` and exits 0. The docs say otherwise. docs/work-graphs.md states that a required report makes rendering or delivery failure fail the workflow, and the DSL reference entry for `report(required)` reads "False makes the report advisory". Decide what `required` means on a report (delivery failure settles the task failing and is surfaced, the verdict stands), make the reference table and work-graphs.md say it, and cover it with a test."""

[[content.acceptance_criteria]]
text = "a failing required report settles failing, the run's verdict is unchanged, and a test pins both"
status = "pending"
category = "fixed"

[[content.acceptance_criteria]]
text = "the report() entry in crucible/src/plan/starlark/reference.rs and the regenerated docs/dsl-reference.md say what required does on a report"
status = "pending"
category = "fixed"

[[content.acceptance_criteria]]
text = "docs/work-graphs.md no longer claims a required report failure fails the workflow"
status = "pending"
category = "fixed"

[[content.acceptance_criteria]]
text = "examples/playbook/README.md's expected output includes the publish-report row a local run prints"
status = "pending"
category = "fixed"
