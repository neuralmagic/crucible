#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-28-a652-005"
title = "Give a run a disposable cluster through an Oubliette service"
status = "queue"
created = "2026-09-28"
refs = [
    "RFC-0005:C-SERVICE-LIFECYCLE",
    "RFC-0005:C-SERVICE-HANDOFF",
    "RFC-0005:C-SERVICE-CATALOG",
]
depends_on = ["WI-2026-09-28-a652-004"]

[content]
description = "A run that needs cluster access gets a disposable vCluster from Oubliette (tlrmchlsmth/oubliette) instead of a namespace or a narrow job API: the run supervisor declares oub-connect as a service, which owns the Oubliette's lifecycle and serves the virtual API over the gateway loopback with a short-lived virtual kubeconfig, while Kueue admission and host policy stay on the host. The agent can use kubectl freely inside a blast radius that is deleted with the run. This is ADR-0002's mediated provisioning for GPU work, run under RFC-0005."
notes = ["RFC-0005 as drafted forbids any credential in the sandbox; this item needs a rule for a service handing a task a disclosed, rotating credential scoped to a disposable target, like the OpenShell fork's loopback AWS credential emulator."]

[[content.acceptance_criteria]]
text = "a manifest declares oub-connect as a service; a run that needs it gets one Oubliette, created before the first task that needs it and deleted when the run ends, labeled with the run identifier"
status = "pending"
category = "added"

[[content.acceptance_criteria]]
text = "an agent task that needs it gets a virtual kubeconfig reaching the Oubliette's API through the gateway loopback, with a token scoped to the virtual cluster and rotated by the connector; no host credential enters the sandbox"
status = "pending"
category = "added"

[[content.acceptance_criteria]]
text = "work the agent submits in the Oubliette is admitted through the host's Kueue queue, so the run's GPU use is bounded by host quota"
status = "pending"
category = "added"

[[content.acceptance_criteria]]
text = "tests run against a real cluster with Oubliette and Kueue installed, no mocked API server"
status = "pending"
category = "added"
