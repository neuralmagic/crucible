#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-08-23-003"
title = "Refuse formatting operations that launder external text"
status = "active"
created = "2026-08-23"
started = "2026-09-23"
refs = [
    "RFC-0002:C-PLAYBOOK-PARAMS",
    "ADR-0050",
]

[content]
description = 'ExternalText implements only add/radd, but str(param("x")), "%s" % param("x"), and any Display-reachable path convert a supplied value to a plain unmarked string before render_prompt sees it, so a hostile value bypasses the external-input markers entirely; reproduced live through compile_source_with (the rendered prompt carried a forged close marker and instruction text outside any marked region). Refuse these operations the way external text is already refused outside a prompt. Found by the [[WI-2026-08-22-009]] verifier. Also make a stripped marker loud: today a value carrying markers is silently rewritten, so an operator never learns an injection was attempted. Design recorded in [[ADR-0050]].'

[[content.acceptance_criteria]]
text = "str(), %-formatting, and every other Display-reachable conversion of external text is a compile error, with a test per operator"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "a value that carried a marker is surfaced loudly, not silently rewritten"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "calling a string method on external text is a compile error at the call that says to join the value with + instead"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "a hostile supplied value reaches a compiled prompt only inside its marked region through every conversion path, with a test per path"
status = "done"
category = "security"

[[content.acceptance_criteria]]
text = "[[RFC-0002:C-PLAYBOOK-PARAMS]] states that converting external text and a marker-carrying value are refused"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "the param() reference entry and docs/dsl-reference.md say how a supplied value reaches a prompt"
status = "done"
category = "chore"
