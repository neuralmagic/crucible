#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-23-001"
title = "Emit asks from a playbook task"
status = "active"
created = "2026-09-23"
started = "2026-09-23"
refs = [
    "RFC-0002:C-ASKS",
    "RFC-0002:C-PLAYBOOK-SHAPE",
    "RFC-0002:C-REVISE-LOOP",
    "ADR-0050",
]

[content]
description = "[[RFC-0002:C-ASKS]] specified asks and the contract carried an ask key and an asks_emitted event, but no pack could emit one. A task now declares the workflows it may ask for, returns asks under the reserved output field asks, and the executor checks them when the task settles passing: shape through the contract's Ask, declared workflow, run-wide (workflow, key) uniqueness, and a launcher-set run bound (plan run --max-asks, default 16) that fails the task that would pass it. Emitted asks reach the session log ahead of the task's row and plan_admitted states the bound and each task's workflows. The run never dispatches an ask; admission is the controller's, tracked in [[WI-2026-09-23-002]]."
notes = ["Playbook resume is not implemented in plan::exec, so a resumed run does not fold earlier asks into the ledger. Whoever builds [[RFC-0002:C-PLAYBOOK-RESUME]] must count folded asks against the bound and cover it with a test."]

[[content.acceptance_criteria]]
text = "workflow.star accepts asks = [...] on agent, skill, command, and evaluate, compiles it into the IR, and rejects it outside the playbook lane, on engine-owned tasks, in a revise loop, and with a malformed or repeated workflow name"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "a passing task's asks are checked before its git-memory commit, and a malformed ask, an undeclared workflow, a repeated workflow and key, or an ask past the run bound fails that task with its output kept and nothing emitted"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the run bound is set by plan run --max-asks, defaults when unset, counts across tasks and mapped instances, and meets a concurrent batch in declaration order"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "asks_emitted is written to the session log before the emitting task's task_result, and plan_admitted carries max_asks and each task's declared workflows (CONTRACT_VERSION 1.8.0)"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "an Ask refuses fields besides key, workflow, and params, parameter values outside the declared parameter types, and parameters over 4096 encoded bytes, on construction and on decode"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "unit tests per layer, the exhaustive three-task executor test extended with an asking outcome under a bound of one, and an end-to-end manifest plan run reading the session log"
status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "C-ASKS states the DSL surface, the reserved field, the bound, and the log ordering; docs/work-graphs.md, the DSL reference, and examples/triage show a roundup asking for one fix run per triaged bug"
status = "done"
category = "chore"
