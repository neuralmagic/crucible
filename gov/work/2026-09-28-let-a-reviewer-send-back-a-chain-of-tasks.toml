#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-28-a652-002"
title = "Let a reviewer send back a chain of tasks"
status = "active"
created = "2026-09-28"
started = "2026-09-28"
refs = [
    "RFC-0002:C-REVISE-LOOP",
    "RFC-0002:C-PLAYBOOK-SHAPE",
    "RFC-0001:C-ROUTE",
]

[content]
description = "A reviewer's revise names one or more targets, so a failing verdict re-runs a chain of tasks (the targets and every task between them and the reviewer) for a bounded number of rounds. A repair that needs more than one producer re-run has been one opaque task or a hand-rolled script outside the graph; this puts it on the graph with the round, spend, and verdict accounting a single-target revise already has. A single target keeps its IR and admitted-plan meaning."

[[content.acceptance_criteria]]
text = "`revise` takes a task or a list of tasks in the DSL, the IR, and the generated TOML; a one-target revise serializes exactly as before"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "validation rejects a target the reviewer does not reach, a body that omits a task on a path between two body tasks, a task in two bodies, a reviewer that is a target, and a body task of an unsupported kind or mapped, and names every offending task"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the executor runs every revise loop as a body walked in dependency order per round, with per-task join and when, `[round-N]` rows, last-round rows under each task's name, and `revision` plus the reviewer's captured files given to every target from round two"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "a body with any task unrunnable on the substrate runs as plain tasks, and a first round that dispatches nothing writes no round rows"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "plan_admitted carries revise as a string for one target and a list for a chain, an empty string otherwise; the contract crate reads both forms, and CONTRACT_VERSION moves to 1.11.0"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "executor tests cover a three-task body across pass, fail, blocked, not-taken, and ceiling outcomes, plus an exhaustive check of the loop invariants over small bodies"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "a harness test drives a chain revise loop through the real plan runner: shell commands, staged inputs, captured files, and git memory"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the DSL reference, playbook-patterns docs, and rendered RFC text describe chain revise loops"
status = "done"
category = "changed"
