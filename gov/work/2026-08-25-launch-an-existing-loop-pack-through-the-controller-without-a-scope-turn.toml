#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-08-25-001"
title = "Launch an existing loop pack through the controller without a scope turn"
status = "active"
created = "2026-08-25"
started = "2026-08-26"
refs = ["RFC-0002:C-PLAYBOOK-LANE"]

[content]
description = "Provide a hosted launch path for a scored autoresearch pack that already exists in a repository, without spending a scope turn to re-author it. The controller freezes and validates the named pack, records it as an approved scope, and reuses the existing build and run lifecycle; examples/selfhost is the end-to-end case."

[[content.acceptance_criteria]]
text = "an admin can launch an autoresearch pack by repository, optional ref, and path without a scope turn"
status = "pending"
category = "added"

[[content.acceptance_criteria]]
text = "invalid or non-autoresearch pack paths are refused before durable launch state is created"
status = "pending"
category = "added"

[[content.acceptance_criteria]]
text = "the frozen pack enters as an approved scope and dispatches with the controller run knobs through the ordinary lifecycle"
status = "pending"
category = "added"

[[content.acceptance_criteria]]
text = "focused tests and a live examples/selfhost run verify direct launch, queue wake-up, and run tracking"
status = "pending"
category = "chore"
