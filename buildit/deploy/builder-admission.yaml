# The pods `buildit mcp` may create in its builder namespace, as a ValidatingAdmissionPolicy
# (admissionregistration.k8s.io/v1, Kubernetes 1.30+). Whoever may create pods there (a run's loop
# account) can create only a builder pod shaped like the one buildit/src/mcp.rs `builder_pod`
# makes: the buildah image, one unprivileged non-root container that does not ask for seccomp
# Unconfined, emptyDir volumes, no host namespaces, no service account token or other Secret, no
# node, runtime, toleration, sysctl or SELinux overrides, and AppArmor unconfined for that container
# alone. Admission defaults are admitted: the not-ready and unreachable tolerations every pod gets,
# a global default PriorityClass, and an SELinux level an OpenShift SCC assigns. So is Kueue
# admitting the pod: the update that lifts its kueue.x-k8s.io/admission gate may add the
# ResourceFlavor's tolerations.
# `crucible deploy` renders it with a binding to the builder namespace; buildit's tests check its
# own builder pod passes and the escapes do not.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: buildit-builders
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'buildit.dev/managed-by' in object.metadata.labels &&
        object.metadata.labels['buildit.dev/managed-by'] == 'mcp'
      message: a pod here must carry buildit.dev/managed-by=mcp
    - expression: >-
        size(object.spec.containers) == 1 &&
        object.spec.containers.all(c, c.name == 'builder' && c.image == 'quay.io/buildah/stable:latest')
      message: a pod here runs one container, builder, from quay.io/buildah/stable:latest
    - expression: >-
        (!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) &&
        (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0)
      message: a pod here has no init or ephemeral containers
    - expression: >-
        object.spec.containers.all(c, (!has(c.envFrom) || size(c.envFrom) == 0) &&
        (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
      message: a pod here reads no Secret or ConfigMap into its environment
    - expression: >-
        !has(object.spec.imagePullSecrets) || size(object.spec.imagePullSecrets) == 0
      message: a pod here names no image pull Secret
    - expression: >-
        object.spec.containers.all(c, !has(c.securityContext) ||
        ((!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
        (!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) ||
        size(c.securityContext.capabilities.add) == 0)))
      message: a pod here is not privileged and adds no capabilities
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsUser) &&
        c.securityContext.runAsUser > 0)
      message: a pod here runs as a non-root user
    - expression: >-
        object.spec.containers.all(c, !has(c.securityContext) ||
        !has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type != 'Unconfined') &&
        (!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile) ||
        object.spec.securityContext.seccompProfile.type != 'Unconfined')
      message: a pod here does not ask for seccomp Unconfined
    - expression: >-
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) ||
        c.securityContext.procMount == 'Default')
      message: a pod here keeps the default /proc mount
    - expression: >-
        (!has(object.spec.securityContext) || !has(object.spec.securityContext.seLinuxOptions) ||
        (!has(object.spec.securityContext.seLinuxOptions.type) &&
        !has(object.spec.securityContext.seLinuxOptions.user) &&
        !has(object.spec.securityContext.seLinuxOptions.role))) &&
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.seLinuxOptions) ||
        (!has(c.securityContext.seLinuxOptions.type) && !has(c.securityContext.seLinuxOptions.user) &&
        !has(c.securityContext.seLinuxOptions.role)))
      message: a pod here sets no SELinux user, role or type
    - expression: >-
        !has(object.spec.securityContext) || !has(object.spec.securityContext.sysctls) ||
        size(object.spec.securityContext.sysctls) == 0
      message: a pod here sets no sysctls
    - expression: >-
        request.operation != 'CREATE' || !has(object.spec.nodeName) || object.spec.nodeName == ''
      message: a pod here is placed by the scheduler, not by nodeName
    - expression: >-
        (!has(object.spec.runtimeClassName) || object.spec.runtimeClassName == '') &&
        (!has(object.spec.priorityClassName) || !object.spec.priorityClassName.startsWith('system-'))
      message: a pod here uses the default runtime and no system priority class
    - expression: >-
        !has(object.spec.tolerations) || object.spec.tolerations.all(t, has(t.key) &&
        t.key in ['node.kubernetes.io/not-ready', 'node.kubernetes.io/unreachable'] &&
        has(t.effect) && t.effect == 'NoExecute') ||
        (request.operation == 'UPDATE' && has(oldObject.spec.schedulingGates) &&
        oldObject.spec.schedulingGates.exists(g, g.name == 'kueue.x-k8s.io/admission') &&
        (!has(object.spec.schedulingGates) ||
        !object.spec.schedulingGates.exists(g, g.name == 'kueue.x-k8s.io/admission')))
      message: >-
        a pod here tolerates only the not-ready and unreachable taints every pod gets, and its
        Kueue flavor's on admission
    - expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: a pod here shares no host namespace
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir))
      message: a pod here mounts only emptyDir volumes
    - expression: >-
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false &&
        (!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == 'default')
      message: a pod here runs as the default account without its token
    - expression: >-
        !has(object.metadata.annotations) || object.metadata.annotations.all(k,
        !k.startsWith('container.apparmor.security.beta.kubernetes.io/') ||
        (k == 'container.apparmor.security.beta.kubernetes.io/builder' &&
        object.metadata.annotations[k] == 'unconfined'))
      message: a pod here sets AppArmor only as buildit does, unconfined for builder
    - expression: >-
        (!has(object.spec.securityContext) || !has(object.spec.securityContext.appArmorProfile)) &&
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.appArmorProfile) ||
        c.securityContext.appArmorProfile.type == 'Unconfined')
      message: a pod here sets AppArmor only as buildit does, unconfined for builder
