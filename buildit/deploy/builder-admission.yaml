# The pods `buildit mcp`'s Jobs may run in its builder namespace, as a ValidatingAdmissionPolicy
# (admissionregistration.k8s.io/v1, Kubernetes 1.30+). Whoever may create Jobs there (a run's loop
# account) gets only pods shaped like buildit/src/jobs.rs makes: a build (buildah, BuildKit run
# from the buildah image, or a script in an image by digest), a run (a built image by digest) or a
# push (crane), with the fetch, buildkit and prepare init containers and the archive sidecar beside
# them; every pod in a user namespace, so root in a container is no one on the node; no
# privilege, added capability or seccomp Unconfined; emptyDir volumes, the build's own inputs
# Secret, and a projection of the default account's token and the cluster's service CA; no host
# namespaces, no service account token mount or other Secret (an OpenShift internal registry's
# pull Secret, which the account admission plugin adds, aside), no node, runtime, toleration,
# sysctl or SELinux overrides. Admission defaults are admitted: the not-ready and unreachable
# tolerations every pod gets, the memory-pressure toleration a pod with resource requests gets, a
# global default PriorityClass, and an SELinux level an OpenShift SCC assigns.
# `crucible deploy` renders it with a binding to the builder namespace; buildit's tests check its
# own pods pass and the escapes do not.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: buildit-builders
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  variables:
    - name: inits
      expression: >-
        has(object.spec.initContainers) ? object.spec.initContainers : []
    - name: all
      expression: variables.inits + object.spec.containers
    - name: build
      expression: >-
        has(object.metadata.labels) && 'buildit.dev/build-id' in object.metadata.labels &&
        object.metadata.labels['buildit.dev/build-id'].matches('^buildit-[0-9a-f]{16}$') ?
        object.metadata.labels['buildit.dev/build-id'] : ''
  validations:
    - expression: >-
        has(object.metadata.labels) && 'buildit.dev/managed-by' in object.metadata.labels &&
        object.metadata.labels['buildit.dev/managed-by'] == 'mcp'
      message: a pod here must carry buildit.dev/managed-by=mcp
    - expression: variables.build != ''
      message: a pod here must name its build in buildit.dev/build-id
    - expression: has(object.spec.hostUsers) && object.spec.hostUsers == false
      message: a pod here runs in a user namespace (hostUsers false)
    - expression: >-
        size(object.spec.containers) == 1 &&
        object.spec.containers.all(c,
        (c.name == 'builder' && c.image in
        ['quay.io/buildah/stable:latest', 'gcr.io/go-containerregistry/crane:debug']) ||
        (c.name in ['run', 'layer'] && c.image.contains('@sha256:')))
      message: >-
        a pod here runs one container: builder from buildah or crane, or a run or a layer build
        from an image by digest
    - expression: >-
        variables.inits.all(c,
        (c.name == 'fetch' && c.image == 'gcr.io/go-containerregistry/crane:debug' &&
        !has(c.restartPolicy)) ||
        (c.name == 'buildkit' && c.image == 'docker.io/moby/buildkit:v0.35.0-rootless' &&
        !has(c.restartPolicy)) ||
        (c.name == 'prepare' && c.image == 'quay.io/buildah/stable:latest' &&
        !has(c.restartPolicy)) ||
        (c.name == 'archive' && c.image == 'quay.io/buildah/stable:latest' &&
        has(c.restartPolicy) && c.restartPolicy == 'Always'))
      message: >-
        a pod here has init containers fetch (crane), buildkit (BuildKit), prepare (buildah) and
        the archive sidecar (buildah) alone
    - expression: >-
        !has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0
      message: a pod here has no ephemeral containers
    - expression: >-
        variables.all.all(c, (!has(c.envFrom) || size(c.envFrom) == 0) &&
        (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
      message: a pod here reads no Secret or ConfigMap into its environment
    - expression: >-
        !has(object.spec.imagePullSecrets) ||
        object.spec.imagePullSecrets.all(s, s.name.startsWith('default-dockercfg-'))
      message: a pod here names no image pull Secret but the default account's registry one
    - expression: >-
        variables.all.all(c, !has(c.securityContext) ||
        ((!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
        (!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) ||
        size(c.securityContext.capabilities.add) == 0)))
      message: a pod here is not privileged and adds no capabilities
    - expression: >-
        variables.all.all(c, !has(c.securityContext) ||
        !has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type != 'Unconfined') &&
        (!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile) ||
        object.spec.securityContext.seccompProfile.type != 'Unconfined')
      message: a pod here does not ask for seccomp Unconfined
    - expression: >-
        variables.all.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) ||
        c.securityContext.procMount == 'Default')
      message: a pod here keeps the default /proc mount
    - expression: >-
        (!has(object.spec.securityContext) || !has(object.spec.securityContext.seLinuxOptions) ||
        (!has(object.spec.securityContext.seLinuxOptions.type) &&
        !has(object.spec.securityContext.seLinuxOptions.user) &&
        !has(object.spec.securityContext.seLinuxOptions.role))) &&
        variables.all.all(c, !has(c.securityContext) || !has(c.securityContext.seLinuxOptions) ||
        (!has(c.securityContext.seLinuxOptions.type) && !has(c.securityContext.seLinuxOptions.user) &&
        !has(c.securityContext.seLinuxOptions.role)))
      message: a pod here sets no SELinux user, role or type
    - expression: >-
        !has(object.spec.securityContext) || !has(object.spec.securityContext.sysctls) ||
        size(object.spec.securityContext.sysctls) == 0
      message: a pod here sets no sysctls
    - expression: >-
        request.operation != 'CREATE' || !has(object.spec.nodeName) || object.spec.nodeName == ''
      message: a pod here is placed by the scheduler, not by nodeName
    - expression: >-
        (!has(object.spec.runtimeClassName) || object.spec.runtimeClassName == '') &&
        (!has(object.spec.priorityClassName) || !object.spec.priorityClassName.startsWith('system-'))
      message: a pod here uses the default runtime and no system priority class
    - expression: >-
        !has(object.spec.tolerations) || object.spec.tolerations.all(t, has(t.key) &&
        has(t.effect) &&
        ((t.key in ['node.kubernetes.io/not-ready', 'node.kubernetes.io/unreachable'] &&
        t.effect == 'NoExecute') ||
        (t.key == 'node.kubernetes.io/memory-pressure' && t.effect == 'NoSchedule')))
      message: a pod here tolerates only the not-ready, unreachable and memory-pressure taints admission adds
    - expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: a pod here shares no host namespace
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) ||
        (has(v.secret) && has(v.secret.secretName) &&
        v.secret.secretName.startsWith(variables.build) && v.secret.secretName.endsWith('-inputs')) ||
        (has(v.projected) && has(v.projected.sources) && v.projected.sources.all(s,
        (has(s.serviceAccountToken) && !has(s.serviceAccountToken.audience)) ||
        (has(s.configMap) && s.configMap.name == 'openshift-service-ca.crt'))))
      message: >-
        a pod here mounts emptyDir volumes, its build's inputs Secret, and the account's token
        and the service CA alone
    - expression: >-
        variables.all.filter(c, c.name in ['run', 'layer', 'fetch', 'buildkit']).all(c,
        !has(c.volumeMounts) ||
        c.volumeMounts.all(m, has(object.spec.volumes) &&
        object.spec.volumes.exists(v, v.name == m.name && has(v.emptyDir))))
      message: >-
        a pod here mounts its inputs Secret and the account's token only in the builder and the
        archive, never in a run, a layer build's script, the fetch or the buildkit init container
    - expression: >-
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false &&
        (!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == 'default')
      message: a pod here runs as the default account without its token mounted
    - expression: >-
        !has(object.metadata.annotations) || object.metadata.annotations.all(k,
        !k.startsWith('container.apparmor.security.beta.kubernetes.io/'))
      message: a pod here sets no AppArmor annotation
    - expression: >-
        (!has(object.spec.securityContext) || !has(object.spec.securityContext.appArmorProfile)) &&
        variables.all.all(c, !has(c.securityContext) || !has(c.securityContext.appArmorProfile))
      message: a pod here sets no AppArmor profile
