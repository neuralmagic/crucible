[package]
name = "buildit"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Build and push container images remotely on a Kubernetes cluster via unprivileged builder pods"
license = "MIT"
repository = "https://github.com/wseaton/buildit"
readme = "README.md"
keywords = ["kubernetes", "containers", "buildkit", "remote-build", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
clap.workspace = true
crucible-mcp-auth = { path = "../crucible-mcp-auth" }
flate2 = "1.1.9"
futures-util = "0.3.32"
ignore = "0.4.27"
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring", "ws"] }
oci-client = { version = "0.17.0", default-features = false, features = ["rustls-tls"] }
regex = "1.12.4"
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-unix-socket"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9.42"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "io-std", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url.workspace = true


[dev-dependencies]
cel = { workspace = true, features = ["json"] }
crucible-mcp-auth = { path = "../crucible-mcp-auth", features = ["e2e"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5", features = ["client", "transport-streamable-http-client-reqwest"] }
