[package]
name = "xtask"
description = "Repo automation (`cargo xtask …`): tasks CI and the justfile shell out to. Never shipped: not in any release/image `-p` list, and `cargo xtask` builds the dev profile."
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
proc-macro2 = "1"
serde.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
