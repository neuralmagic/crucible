[package]
name = "buildq"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Container builds as Kueue-queued one-shot Jobs, watched for status, over MCP"

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
clap.workspace = true
futures-util = "0.3.32"
ignore = "0.4.27"
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring"] }
oci-client = { version = "0.17.0", default-features = false, features = ["rustls-tls"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { workspace = true, features = ["signal", "io-std", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
