[book]
title = "crucible"
description = "A deterministic agent orchestrator with native sandboxing."
authors = ["crucible contributors"]
src = "docs"
language = "en"

[output.html]
theme = "docs/theme"
git-repository-url = "https://github.com/neuralmagic/crucible"
edit-url-template = "https://github.com/neuralmagic/crucible/edit/main/{path}"
default-theme = "rust"
preferred-dark-theme = "ayu"
no-section-label = true
additional-css = ["docs/theme/crucible.css"]
additional-js = ["mermaid-init.js", "docs/theme/molten.js"]

[output.html.fold]
enable = true
level = 0

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
