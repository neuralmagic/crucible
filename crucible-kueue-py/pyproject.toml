[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "crucible-kueue"
description = "Client for crucible-kueue, for a crucible run's command and evaluate tasks."
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "crucible_kueue._native"
