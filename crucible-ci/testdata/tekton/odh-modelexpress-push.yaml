apiVersion: tekton.dev/v1
kind: PipelineRun
#
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/modelexpress?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-modelexpress-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-modelexpress-on-push
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-modelexpress:odh-stable
  - name: dockerfile
    value: docker/Dockerfile.konflux
  - name: path-context
    value: .
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: |
      [
        {"type": "cargo", "path": "."},
        {"type": "rpm", "path": "docker/konflux/server"},
        {"type": "generic", "path": "docker/konflux/server", "lockfile": "generic-fetcher.yaml"}
      ]
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-modelexpress-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
