[package]
name = "crucible-playbooks"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, like crucible-desktop: Rune is pre-release and pinned to a dev rev, so the
# engine workspace must not inherit it.
[workspace]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924", default-features = false }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
crucible-contract = { path = "../crucible-contract" }
crux = { path = "../crux", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
hot = ["rune/hot"]
