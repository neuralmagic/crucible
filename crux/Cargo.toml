[package]
name = "crux"
description = "A token-frugal CLI for the crucible controller API, and the MCP tool surface the controller hosts."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
crucible-contract = { path = "../crucible-contract" }
serde.workspace = true
serde_json.workspace = true
# Same major + TLS backend as the controller's own client, so the dependency tree stays one tree.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "zstd"] }
# The `Transport` trait is behind `dyn`, which native async-fn-in-trait cannot do; async-trait
# boxes the futures. Same version the controller already uses.
async-trait = "0.1"
# The MCP tool surface the controller hosts. Version tracks the controller's.
rmcp = { workspace = true, features = ["server", "macros"], optional = true }
# The config file. Same version the controller reads manifests with.
toml = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false }

[features]
default = ["cli"]
# The command line, the operations it shares with the MCP tools, and that tool surface. Without
# it the crate is the client: config, transport and DTOs.
cli = ["dep:clap", "dep:rmcp"]

[[bin]]
name = "crux"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "surface"
required-features = ["cli"]

[[test]]
name = "roundtrip"
required-features = ["cli"]

[dev-dependencies]
# Stands in for the controller in the client tests — same version family as the controller's own
# server.
axum = "0.8"
tempfile = "3"
