# Realm `crucible`: the authorization server for crucible's MCP servers.
#
#   spire         OIDC IdP for SPIRE's JWT issuer. Only used to verify client assertions
#                 (federated-jwt); never shown on the login page.
#   openshift-v4  Brokered cluster login for humans (claude-code).
#   claude-code   Public client, auth code + PKCE S256, loopback callback on :8765.
#   run-auth-spike
#                 The shape of the per-run client the crucible controller creates at dispatch and
#                 deletes at collection: federated-jwt pinned to one sandbox's SPIFFE ID, claims
#                 hardcoded from the run (sub = the human who launched it, act.sub = the sandbox).
#                 Deleting it revokes the sandbox's ability to mint tokens.
#
# Scopes kueue.read / kueue.submit each carry the crucible-kueue audiences, so asking for the
# scope is what binds a token to that resource server.
#
# A KeycloakRealmImport only creates a realm that does not exist yet; to re-import, delete the
# realm in the admin console first.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: crucible
  namespace: rhbk
spec:
  keycloakCRName: keycloak
  placeholders:
    OPENSHIFT_OAUTH_CLIENT_SECRET:
      secret:
        name: keycloak-openshift-oauth
        key: client-secret
  realm:
    realm: crucible
    enabled: true
    sslRequired: external
    accessTokenLifespan: 300
    identityProviders:
      - alias: spire
        providerId: oidc
        enabled: true
        hideOnLogin: true
        config:
          issuer: https://oidc-discovery.apps.openshift.nm.rdu4.corp.redhat.com
          jwksUrl: https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc/keys
          useJwksUrl: "true"
          validateSignature: "true"
          supportsClientAssertions: "true"
          supportsClientAssertionReuse: "true"
          clientId: unused
          clientSecret: unused
          clientAuthMethod: client_secret_post
          authorizationUrl: https://oidc-discovery.apps.openshift.nm.rdu4.corp.redhat.com/unused
          tokenUrl: https://oidc-discovery.apps.openshift.nm.rdu4.corp.redhat.com/unused
          syncMode: IMPORT
      # Users exist only through this login, with their OpenShift name as username, re-synced on
      # every login. kube_user is that name. realm-dev.sh also turns off the first broker login's
      # profile review, which would let a person edit it (an import cannot reach that config).
      - alias: openshift-v4
        providerId: openshift-v4
        enabled: true
        trustEmail: false
        config:
          baseUrl: https://api.openshift.nm.rdu4.corp.redhat.com:6443
          clientId: keycloak-crucible
          clientSecret: ${OPENSHIFT_OAUTH_CLIENT_SECRET}
          defaultScope: user:info
          syncMode: FORCE
    clientScopes:
      # Defining any client scope in an import replaces Keycloak's built-in set, so the two the
      # claude-code client relies on are restated here.
      - name: basic
        protocol: openid-connect
        attributes:
          include.in.token.scope: "false"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: sub
            protocol: openid-connect
            protocolMapper: oidc-sub-mapper
            config:
              access.token.claim: "true"
              introspection.token.claim: "true"
          - name: auth_time
            protocol: openid-connect
            protocolMapper: oidc-usersessionmodel-note-mapper
            config:
              user.session.note: AUTH_TIME
              claim.name: auth_time
              jsonType.label: long
              access.token.claim: "true"
              id.token.claim: "true"
      - name: profile
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "true"
        protocolMappers:
          - name: username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: username
              claim.name: preferred_username
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "true"
      - name: kueue.read
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: aud-kueue-svc
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: http://crucible-kueue.crucible-system.svc.cluster.local:8850/mcp
              access.token.claim: "true"
              id.token.claim: "false"
          - name: aud-kueue-route
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: https://crucible-kueue.apps.openshift.nm.rdu4.corp.redhat.com/mcp
              access.token.claim: "true"
              id.token.claim: "false"
      - name: kueue.submit
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: aud-kueue-svc
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: http://crucible-kueue.crucible-system.svc.cluster.local:8850/mcp
              access.token.claim: "true"
              id.token.claim: "false"
          - name: aud-kueue-route
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: https://crucible-kueue.apps.openshift.nm.rdu4.corp.redhat.com/mcp
              access.token.claim: "true"
              id.token.claim: "false"
      - name: buildit.read
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: aud-buildit-sandbox
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: http://host.openshell.internal:8849/mcp
              access.token.claim: "true"
              id.token.claim: "false"
      - name: buildit.build
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: aud-buildit-sandbox
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: http://host.openshell.internal:8849/mcp
              access.token.claim: "true"
              id.token.claim: "false"
      - name: crucible-tenant
        description: Tenant claims for humans, from user attributes set by an operator.
        protocol: openid-connect
        attributes:
          include.in.token.scope: "false"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: namespace
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: crucible_namespace
              claim.name: namespace
              jsonType.label: String
              access.token.claim: "true"
          - name: queues
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: crucible_queues
              claim.name: queues
              jsonType.label: String
              multivalued: "true"
              access.token.claim: "true"
          - name: role
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: crucible_role
              claim.name: role
              jsonType.label: String
              access.token.claim: "true"
    clients:
      - clientId: claude-code
        name: Claude Code
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - http://localhost:8765/callback
          - http://127.0.0.1:8765/callback
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "+"
        protocolMappers:
          - name: kube_user
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            config:
              user.attribute: username
              claim.name: kube_user
              jsonType.label: String
              access.token.claim: "true"
        defaultClientScopes:
          - basic
          - profile
          - crucible-tenant
          - kueue.read
          - kueue.submit
        optionalClientScopes:
          - offline_access
      - clientId: run-auth-spike
        name: crucible run auth-spike
        enabled: true
        publicClient: false
        clientAuthenticatorType: federated-jwt
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        fullScopeAllowed: false
        attributes:
          jwt.credential.issuer: spire
          jwt.credential.sub: spiffe://pirate.crucible/openshell/sandbox/auth-spike
          access.token.lifespan: "300"
          use.refresh.tokens: "false"
          client_credentials.use_refresh_token: "false"
        defaultClientScopes:
          - kueue.read
          - kueue.submit
          - buildit.read
          - buildit.build
        optionalClientScopes: []
        protocolMappers:
          - name: sub
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: sub
              claim.value: weaton
              jsonType.label: String
              access.token.claim: "true"
          - name: act
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: act
              claim.value: '{"sub":"spiffe://pirate.crucible/openshell/sandbox/auth-spike"}'
              jsonType.label: JSON
              access.token.claim: "true"
          - name: kube_user
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: kube_user
              claim.value: crucible-e2e-sar
              jsonType.label: String
              access.token.claim: "true"
          - name: sandbox
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: sandbox
              claim.value: auth-spike
              jsonType.label: String
              access.token.claim: "true"
          - name: run_id
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: run_id
              claim.value: auth-spike
              jsonType.label: String
              access.token.claim: "true"
          - name: namespace
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: namespace
              claim.value: crucible-kueue-e2e
              jsonType.label: String
              access.token.claim: "true"
          - name: queues
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: queues
              claim.value: '["crucible-e2e"]'
              jsonType.label: JSON
              access.token.claim: "true"
          - name: role
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: role
              claim.value: submitter
              jsonType.label: String
              access.token.claim: "true"
