# What the e2e's agent token may do through crucible-kueue: the spike client carries
# kube_user=crucible-e2e-sar (a user that never logs in), so these grants are all it has. Jobs on
# LocalQueue crucible-e2e, yes; Deployments, no, which is how the e2e proves a refusal comes from
# Kubernetes RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crucible-e2e-sar
  namespace: crucible-kueue-e2e
rules:
  - apiGroups: [kueue.x-k8s.io]
    resources: [localqueues]
    resourceNames: [crucible-e2e]
    verbs: [get, use]
  - apiGroups: [kueue.x-k8s.io]
    resources: [localqueues, workloads]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, update, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crucible-e2e-sar
  namespace: crucible-kueue-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crucible-e2e-sar
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: crucible-e2e-sar
