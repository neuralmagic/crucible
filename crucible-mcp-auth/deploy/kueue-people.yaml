# A crucible-kueue for people, behind a Route, beside the sandbox-facing one (which this leaves
# untouched). It accepts realm access tokens only, decides every call with the shipped tool policy
# and Kubernetes RBAC (--kube-authz openshift), and acts with its own service account.
#
# Applied by kueue-people.sh, which substitutes ${IMAGE} and creates the policy ConfigMap from
# crucible-kueue/deploy/kueue-policy.toml. The service account's workload verbs are granted per
# namespace (kueue-people.sh binds them in each of PEOPLE_NAMESPACES); RBAC on the person decides
# within those.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crucible-kueue-people
  namespace: crucible-system
  labels: {app.kubernetes.io/name: crucible-kueue-people}
---
# Ask the API server about people, and read their OpenShift groups to pass along.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crucible-kueue-people-authz
  labels: {app.kubernetes.io/name: crucible-kueue-people}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [user.openshift.io]
    resources: [groups]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crucible-kueue-people-authz
  labels: {app.kubernetes.io/name: crucible-kueue-people}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: crucible-kueue-people-authz}
subjects:
  - {kind: ServiceAccount, name: crucible-kueue-people, namespace: crucible-system}
---
# Queue capacity and hardware are cluster facts (the existing crucible-kueue-cluster role).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crucible-kueue-people-cluster
  labels: {app.kubernetes.io/name: crucible-kueue-people}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: crucible-kueue-cluster}
subjects:
  - {kind: ServiceAccount, name: crucible-kueue-people, namespace: crucible-system}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucible-kueue-people
  namespace: crucible-system
  labels: {app.kubernetes.io/name: crucible-kueue-people}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: crucible-kueue-people}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crucible-kueue-people}
    spec:
      serviceAccountName: crucible-kueue-people
      imagePullSecrets: [{name: quay-wseaton-pull}]
      containers:
        - name: crucible-kueue
          image: ${IMAGE}
          args:
            - --bind
            - 0.0.0.0:8850
            # The realm's issuer as tokens carry it; its keys from the in-cluster Service, since
            # pods cannot resolve *.apps hosts.
            - --issuer
            - https://keycloak.apps.openshift.nm.rdu4.corp.redhat.com/realms/crucible=http://keycloak-service.rhbk.svc.cluster.local:8080/realms/crucible/protocol/openid-connect/certs
            - --resource
            - https://crucible-kueue.apps.openshift.nm.rdu4.corp.redhat.com/mcp
            - --allowed-host
            - crucible-kueue.apps.openshift.nm.rdu4.corp.redhat.com
            - --tool-policy
            - /etc/crucible-kueue/kueue-policy.toml
            - --kube-authz
            - openshift
          env:
            - {name: RUST_LOG, value: "info,crucible_mcp_auth=debug"}
          ports:
            - {name: http, containerPort: 8850}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: policy, mountPath: /etc/crucible-kueue, readOnly: true}
      volumes:
        - name: policy
          configMap: {name: crucible-kueue-people-policy}
---
apiVersion: v1
kind: Service
metadata:
  name: crucible-kueue-people
  namespace: crucible-system
  labels: {app.kubernetes.io/name: crucible-kueue-people}
spec:
  selector: {app.kubernetes.io/name: crucible-kueue-people}
  ports:
    - {name: http, port: 8850, targetPort: http}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: crucible-kueue
  namespace: crucible-system
  labels: {app.kubernetes.io/name: crucible-kueue-people}
spec:
  host: crucible-kueue.apps.openshift.nm.rdu4.corp.redhat.com
  to: {kind: Service, name: crucible-kueue-people}
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
