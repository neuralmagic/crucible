# Sandbox + loop-base image feedstock. plan diffs the change set and emits the affected
# (image, arch) matrix via `cargo xtask images plan`; build runs per-arch on native runners
# (amd64 on the beefy self-hosted pool, arm64 on GitHub's hosted arm runners) with docker
# buildx and a per-image-per-arch registry cache on GHCR (type=gha 400s from the AWS
# runners — see docker.yml). On main pushes/nightly, manifest stitches the arch images into
# one multi-arch tag via imagetools, and every pushed digest gets a keyless cosign signature
# plus an SPDX SBOM attached as an OCI referrer and signed the same way. The nightly builds
# with no layer cache so it proves the feedstock still builds from scratch. PRs build
# affected non-heavy images only and push nothing; the build-heavy label opts a PR into the
# heavy columns too. report keeps one tracking issue open while main/nightly is red.
name: images

on:
  pull_request:
    paths:
      - "images/**"
      - "xtask/**"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths:
      - "images/**"
      - "xtask/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, beefy, rust]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand the feedstock
        run: cargo xtask images gen
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: generated-containerfiles
          path: images/generated/
      - name: compute affected matrix
        id: plan
        run: |
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
          esac
          flags=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'build-heavy') }}" != "true" ]; then
            flags="--skip-heavy"
          fi
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
            git diff --name-only "$base" HEAD > changed.txt
            echo "matrix=$(cargo xtask images plan --changed changed.txt $flags)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(cargo xtask images plan $flags)" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan summary
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          {
            echo "### Image build plan"
            count=$(jq -r '.count' <<<"$MATRIX")
            if [ "$count" = 0 ]; then
              echo "No image is affected by this change."
            else
              echo ""
              echo "| image | arches |"
              echo "| --- | --- |"
              jq -r '.build | group_by(.image)[] | "| \(.[0].image) | \(map(.arch) | join(", ")) |"' <<<"$MATRIX"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).count > 0
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted", "linux", "x64", "beefy", "image"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).build }}
    env:
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-containerfiles
          path: images/generated
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # registry.access.redhat.com answers the base image's manifest HEAD with a transient error
      # under a burst of parallel pulls, and buildkit does not retry source resolution, so one
      # retry after a short pause is what separates a flake from a real failure.
      - name: build (push on non-PR)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: images
          file: images/generated/${{ matrix.image }}/Containerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ env.REF }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.REF }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.REF, matrix.arch) || '' }}
      - name: pause before the retry
        if: steps.build.outcome == 'failure'
        run: sleep 45
      - name: build, second attempt
        id: retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: images
          file: images/generated/${{ matrix.image }}/Containerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ env.REF }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.REF }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.REF, matrix.arch) || '' }}
      # A pull-request build is not pushed and exports no digest, so the verdict is the
      # attempts' outcomes, not the digest.
      - name: the built digest
        id: digest
        env:
          FIRST: ${{ steps.build.outputs.digest }}
          SECOND: ${{ steps.retry.outputs.digest }}
          FIRST_OUTCOME: ${{ steps.build.outcome }}
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
        run: |
          if [ "$FIRST_OUTCOME" != "success" ] && [ "$RETRY_OUTCOME" != "success" ]; then
            echo "both build attempts failed" >&2
            exit 1
          fi
          echo "digest=${FIRST:-$SECOND}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - uses: anchore/sbom-action/download-syft@v0
        if: github.event_name != 'pull_request'
        id: syft
      - uses: oras-project/setup-oras@v1
        if: github.event_name != 'pull_request'
        with:
          version: 1.3.0
      - name: sign arch digest, attach + sign sbom
        if: github.event_name != 'pull_request'
        env:
          PINNED: ${{ env.REF }}@${{ steps.digest.outputs.digest }}
        run: |
          # Rekor flakes under load; back off rather than fail a finished build.
          retry() {
            for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed; retrying in $((i * 30))s"; sleep $((i * 30)); done
            "$@"
          }
          retry cosign sign --yes "$PINNED"
          "${{ steps.syft.outputs.cmd }}" scan "registry:$PINNED" -o spdx-json > sbom.spdx.json
          sbom=$(oras attach --artifact-type application/spdx+json --format json "$PINNED" sbom.spdx.json:application/spdx+json | jq -r '.digest')
          echo "sbom referrer: $REF@$sbom ($(du -h sbom.spdx.json | cut -f1))"
          retry cosign sign --yes "$REF@$sbom"
      - name: Build summary
        if: always()
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            if [ -n "$DIGEST" ]; then
              pushed=$([ "${{ github.event_name }}" = "pull_request" ] && echo "built, not pushed" || echo "pushed, signed, SBOM attached")
              echo "**${{ matrix.image }}** \`linux/${{ matrix.arch }}\` — \`$DIGEST\` ($pushed)"
            else
              echo "**${{ matrix.image }}** \`linux/${{ matrix.arch }}\` — :x: build failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: [plan, build]
    # !cancelled(): one failed build leg must not skip the stitch for every other
    # image; the step stitches whichever arch images actually exist.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && fromJSON(needs.plan.outputs.matrix).count > 0 }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).manifest }}
    env:
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: stitch and sign the multi-arch manifest
        id: stitch
        run: |
          retry() {
            for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed; retrying in $((i * 30))s"; sleep $((i * 30)); done
            "$@"
          }
          sources=""
          for arch in ${{ matrix.arches }}; do
            ref="$REF:${{ github.sha }}-$arch"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              sources="$sources $ref"
            else
              echo "::warning::$ref was not pushed; stitching without it"
            fi
          done
          if [ -z "$sources" ]; then
            echo "no arch images exist for $REF at ${{ github.sha }}"
            exit 1
          fi
          # shellcheck disable=SC2086 # one arch ref per word is the point
          docker buildx imagetools create -t "$REF:${{ github.sha }}" -t "$REF:latest" $sources
          digest=$(docker buildx imagetools inspect "$REF:${{ github.sha }}" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "stitched=$sources" >> "$GITHUB_OUTPUT"
          retry cosign sign --yes "$REF@$digest"
      - name: Manifest summary
        run: |
          {
            echo "**${{ matrix.image }}** multi-arch \`${{ steps.stitch.outputs.digest }}\`"
            echo "- tags: \`${{ github.sha }}\`, \`latest\`"
            echo "- stitched from:${{ steps.stitch.outputs.stitched }}"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [plan, build, manifest]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      LABEL: images-ci
    steps:
      - name: Open, refresh, or close the tracking issue
        run: |
          set -euo pipefail
          gh label create "$LABEL" --force --color B60205 --description "the images workflow is red on main"
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ "$FAILED" = "true" ]; then
            body="${{ github.event_name }} run of the images workflow failed: $RUN_URL"
            if [ -z "$open" ]; then
              gh issue create --label "$LABEL" --title "images workflow is failing on main" --body "$body"
            else
              gh issue comment "$open" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "green again: $RUN_URL"
          fi
