name: CI

# Public-repo CI: plain pull_request validation plus merge_group and the main line. Everything
# on the pull_request path runs from public sources with no org registries or org-pinned
# images required.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is a loss in CI (no warm incremental dir); off shrinks the
  # cached target/ and speeds cold builds.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Harden cargo against flaky crates.io fetches: HTTP/2 multiplexing is what throws the
  # intermittent "curl [16] Error in the HTTP2 framing layer" during crate downloads;
  # force HTTP/1.1 to dodge that class, and retry the other transient blips.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  # One job, ordered fail-fast: fmt is instant, then the compile-heavy steps share a single
  # warm target/. Same-repo refs get the org's beefy self-hosted runners (32-core, sccache
  # in S3, baked toolchain); fork PRs MUST stay on hosted runners — self-hosted instances
  # carry an IAM role, and this is a public repo.
  build-and-test:
    timeout-minutes: 25
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && fromJSON('["self-hosted", "beefy", "rust"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The baked AMI already carries the toolchain and tools; hosted runners install them.
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt, clippy
          # The GH cache API round-trips from EC2 are slower than sccache's in-region S3.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install cargo-nextest (hosted only)
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest

      - name: Enable sccache + mold
        if: runner.environment == 'self-hosted'
        run: |
          {
            echo "SCCACHE_BUCKET=llm-d-sccache-783952637884"
            echo "SCCACHE_REGION=us-east-1"
            echo "SCCACHE_S3_KEY_PREFIX=crucible"
            echo "RUSTC_WRAPPER=sccache"
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold"
          } >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      # Guard against the http/tls dependency cluster (reqwest/rustls/hyper/ring/h2) silently
      # growing more duplicate resolved-version generations than it has today, and against a
      # heavy dep leaking into a crate that isn't on its allow-list. Both are deterministic
      # snapshots of current state, see the comments in each script for how to update them
      # when a change is deliberate.
      - name: Dependency guardrails
        run: |
          ./tools/check-dep-dups.sh
          ./tools/check-heavy-dep-allowlist.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings

      # nextest for the run (parallel, per-test isolation), cargo test for doctests,
      # which nextest does not execute.
      - name: Test
        run: cargo nextest run --workspace --all-features --locked

      - name: Doctests
        run: cargo test --doc --workspace --all-features --locked

      - name: sccache stats
        if: runner.environment == 'self-hosted' && always()
        run: sccache --show-stats

  # Supply-chain checks, independent of the build: known-vulnerability audit over Cargo.lock
  # (policy in .cargo/audit.toml) plus the cargo-deny policy (licenses, sources, advisories;
  # see deny.toml, the two ignore lists mirror each other).
  audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install cargo-audit + cargo-deny
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check
