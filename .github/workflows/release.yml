name: Release

# Publish the standalone binaries (crucible engine, the forge build/deploy bins, and the
# crucible-lsp language server) and the VS Code extension as GitHub Release assets, for users who
# want them without pulling the runtime image or building from source.
# Matrix: linux x86_64 / glibc (the deploy target, the binaries link libgit2 + openssl, so a
# static musl build is more trouble than it's worth) and macOS arm64 (the BYO-laptop on-ramp:
# install one binary, `crucible init` on your repo).
#
# Tag a release (v*) to publish. workflow_dispatch: build-only smoke by default, or pass an
# existing release tag as `tag` to build from it and backfill its assets (how a new matrix
# target gets onto an already-cut release without re-tagging).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from and upload assets to (empty = smoke only)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt an in-progress release upload

permissions:
  contents: write # create the release + upload assets

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # x86_64-unknown-linux-gnu, aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Backfill mode builds the tagged source, not whatever main has moved to.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The controller embeds the SPA at compile time, so the bundle has to exist first.
      - name: Build UI
        working-directory: crucible-controller/ui
        env:
          SQLX_OFFLINE: "true"
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build release binaries
        env:
          CRUCIBLE_GIT_SHA: ${{ github.sha }}
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked -p crucible -p forge -p crucible-controller -p crux -p crucible-lsp --bins --features crucible/autoresearch,crucible-controller/autoresearch

      # The extension holds no binary, so one build serves every platform.
      - name: Build VS Code extension
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
          bun run package

      # Collect every top-level executable from target/release (same pattern the Containerfile
      # uses to stage /art/bin) into one tarball + a no-tooling sha256 integrity file.
      # `-perm -u+x`, not GNU-only `-executable`: this step runs on BSD find too (macOS).
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          name="crucible-${tag}-${triple}"
          mkdir -p dist staging
          find target/release -maxdepth 1 -type f -perm -u+x -exec cp {} staging/ \;
          echo "staged binaries:" && ls -la staging/
          tar -C staging -czf "dist/${name}.tar.gz" .
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          if [ -f editors/vscode/crucible-starlark.vsix ]; then
            vsix="crucible-starlark-${tag}.vsix"
            cp editors/vscode/crucible-starlark.vsix "dist/${vsix}"
            ( cd dist && shasum -a 256 "${vsix}" > "${vsix}.sha256" )
          fi
          ls -la dist/

      # On a tag push or a `tag`-input dispatch: publish to that release. On a bare dispatch:
      # smoke only (the build above is the test). `gh release create || true` is idempotent if
      # the release already exists (always the case in backfill mode).
      - name: Upload to release
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "$tag" --generate-notes --verify-tag 2>/dev/null || true
          gh release upload "$tag" dist/* --clobber
