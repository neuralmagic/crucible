name: Release

# Publish the standalone binaries (crucible engine, the forge build/deploy bins, and the
# crucible-lsp language server) and the VS Code extension as GitHub Release assets, for users who
# want them without pulling the runtime image or building from source.
# Matrix: linux x86_64 / glibc (the deploy target, the binaries link libgit2 + openssl, so a
# static musl build is more trouble than it's worth) and macOS arm64 (the BYO-laptop on-ramp:
# install one binary, `crucible init` on your repo).
#
# Tag a release (v*) to publish. workflow_dispatch: build-only smoke by default, or pass an
# existing release tag as `tag` to build from it and backfill its assets (how a new matrix
# target gets onto an already-cut release without re-tagging).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from and upload assets to (empty = smoke only)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt an in-progress release upload

permissions:
  contents: write # create the release + upload assets

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # x86_64-unknown-linux-gnu, aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Backfill mode builds the tagged source, not whatever main has moved to.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The controller embeds the SPA at compile time, so the bundle has to exist first.
      - name: Build UI
        working-directory: crucible-controller/ui
        env:
          SQLX_OFFLINE: "true"
        run: |
          bun install --frozen-lockfile
          bun run build

      # The controller embeds the desktop app's browser build under /next.
      - name: wasm-bindgen version
        id: bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { found = 1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' crucible-desktop/Cargo.lock)
          [ -n "$version" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build /next
        run: |
          sh crucible-desktop/rune-patches.sh
          rustup target add wasm32-unknown-unknown
          cd crucible-desktop
          RUSTFLAGS= CARGO="$(command -v cargo)" bash ../vendor/rune/scripts/web-build.sh crucible-playbooks --no-html --out ../crucible-controller/next-dist

      - name: Build release binaries
        env:
          CRUCIBLE_GIT_SHA: ${{ github.sha }}
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked -p crucible -p forge -p crucible-controller -p crux -p crucible-lsp --bins --features crucible/autoresearch,crucible-controller/autoresearch

      # The extension holds no binary, so one build serves every platform.
      - name: Build VS Code extension
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
          bun run package

      # Collect every top-level executable from target/release (same pattern the Containerfile
      # uses to stage /art/bin) into one tarball + a no-tooling sha256 integrity file.
      # `-perm -u+x`, not GNU-only `-executable`: this step runs on BSD find too (macOS).
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          name="crucible-${tag}-${triple}"
          mkdir -p dist staging
          find target/release -maxdepth 1 -type f -perm -u+x -exec cp {} staging/ \;
          echo "staged binaries:" && ls -la staging/
          tar -C staging -czf "dist/${name}.tar.gz" .
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          if [ -f editors/vscode/crucible-starlark.vsix ]; then
            vsix="crucible-starlark-${tag}.vsix"
            cp editors/vscode/crucible-starlark.vsix "dist/${vsix}"
            ( cd dist && shasum -a 256 "${vsix}" > "${vsix}.sha256" )
          fi
          ls -la dist/

      # On a tag push or a `tag`-input dispatch: publish to that release. On a bare dispatch:
      # smoke only (the build above is the test). `gh release create || true` is idempotent if
      # the release already exists (always the case in backfill mode).
      - name: Upload to release
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "$tag" --generate-notes --verify-tag 2>/dev/null || true
          gh release upload "$tag" dist/* --clobber

  # The desktop app as a Fedora RPM, crucible-lsp beside it, for x86_64 and aarch64.
  desktop-linux:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: git
        run: dnf -y install git

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Fedora packages
        run: sh crucible-desktop/linux/deps.sh

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ""
          cache-workspaces: |
            . -> target
            crucible-desktop -> target

      - name: Rune
        run: sh crucible-desktop/rune-patches.sh

      - name: Build the RPM
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          cargo build --release --locked -p crucible-lsp
          ( cd crucible-desktop && cargo build --release --locked )
          VERSION="${tag#v}" sh crucible-desktop/linux-bundle.sh
          mkdir -p dist
          cp crucible-desktop/target/linux/*.rpm dist/
          ( cd dist && for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done )
          ls -la dist/

      - name: Upload to release
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf -y install gh
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --title "$tag" --generate-notes --verify-tag 2>/dev/null || true
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" dist/* --clobber

  # The macOS desktop app (Crucible Playbooks.app, crucible-lsp inside), signed ad hoc: a
  # downloaded copy needs Open Anyway (or `xattr -d com.apple.quarantine`) on first launch.
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      # rustflags off: the action's default `-D warnings` reaches the vendored Rune, whose release
      # build warns about debug-only tooling.
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ""
          cache-workspaces: |
            . -> target
            crucible-desktop -> target

      - name: Rune
        run: sh crucible-desktop/rune-patches.sh

      - name: Build Crucible Playbooks.app
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          cargo build --release --locked -p crucible-lsp
          ( cd crucible-desktop && cargo build --release --locked )
          VERSION="${tag#v}" sh crucible-desktop/macos-bundle.sh

      - name: Package
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="Crucible-Playbooks-${tag}-aarch64-apple-darwin"
          mkdir -p dist
          ditto -c -k --keepParent "crucible-desktop/target/release/Crucible Playbooks.app" "dist/${name}.zip"
          ( cd dist && shasum -a 256 "${name}.zip" > "${name}.zip.sha256" )
          ls -la dist/

      - name: Upload to release
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "$tag" --generate-notes --verify-tag 2>/dev/null || true
          gh release upload "$tag" dist/* --clobber
