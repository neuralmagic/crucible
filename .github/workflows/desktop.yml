name: Desktop

# Format, lint and test the desktop app (crucible-desktop, its own Cargo workspace on Rune, so
# ci.yml never builds it) on macOS and Fedora, and assemble its .app bundle and RPM. Runs only when the app, the crates it
# builds from (crux, crucible-contract, crucible-lsp, and the root Cargo.toml whose workspace
# dependencies they inherit) or this workflow change: macOS runner minutes are billed.
on:
  push:
    branches: [main]
    paths:
      - 'crucible-desktop/**'
      - 'crux/**'
      - 'crucible-contract/**'
      - 'crucible-lsp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'crucible-desktop/**'
      - 'crux/**'
      - 'crucible-contract/**'
      - 'crucible-lsp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt, clippy
          cache-workspaces: crucible-desktop -> target

      # Rune at its pinned revision plus the patches the app carries, into vendor/rune.
      - name: Rune
        run: sh crucible-desktop/rune-patches.sh

      - name: fmt
        working-directory: crucible-desktop
        run: cargo fmt --check

      - name: clippy
        working-directory: crucible-desktop
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # The language-server test drives the real crucible-lsp.
      - name: crucible-lsp
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --locked -p crucible-lsp

      - name: test
        working-directory: crucible-desktop
        run: CRUCIBLE_LSP="$GITHUB_WORKSPACE/target/debug/crucible-lsp" cargo test --locked

  # The release bundle, built the way the release workflow builds it, so a change that breaks the
  # bundle fails here rather than on a tag.
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # rustflags off: the action's default `-D warnings` reaches the vendored Rune, whose release
      # build warns about debug-only tooling. The check job holds the app itself to clippy.
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ""
          cache-workspaces: |
            . -> target
            crucible-desktop -> target

      - name: Rune
        run: sh crucible-desktop/rune-patches.sh

      - name: Build
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo build --release --locked -p crucible-lsp
          ( cd crucible-desktop && cargo build --release --locked )
          sh crucible-desktop/macos-bundle.sh

      - name: Check the bundle
        run: |
          set -euo pipefail
          app="crucible-desktop/target/release/Crucible Playbooks.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/crucible-playbooks"
          test -x "$app/Contents/MacOS/crucible-lsp"
          codesign --verify --deep "$app"
          # The binary starts: as a tunnel supervisor with no command it refuses with code 2.
          code=0
          "$app/Contents/MacOS/crucible-playbooks" --keep </dev/null || code=$?
          test "$code" -eq 2

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent "crucible-desktop/target/release/Crucible Playbooks.app" \
            "dist/Crucible-Playbooks-${GITHUB_SHA::7}-aarch64-apple-darwin.zip"
          ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: crucible-playbooks-app
          path: dist/*.zip
          retention-days: 14

  # The app on Fedora: clippy, the tests (the instance hand-off on a session bus), a headless
  # render through Mesa's software Vulkan, and the RPM, installed and started.
  linux:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: git
        run: dnf -y install git

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fedora packages
        run: sh crucible-desktop/linux/deps.sh

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: clippy
          rustflags: ""
          cache-workspaces: |
            . -> target
            crucible-desktop -> target

      - name: Rune
        run: sh crucible-desktop/rune-patches.sh

      - name: clippy
        working-directory: crucible-desktop
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: crucible-lsp
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --locked -p crucible-lsp

      - name: test
        working-directory: crucible-desktop
        run: CRUCIBLE_LSP="$GITHUB_WORKSPACE/target/debug/crucible-lsp" dbus-run-session -- cargo test --locked

      - name: Render
        working-directory: crucible-desktop
        run: |
          set -euo pipefail
          cargo run --locked -- --scene local --snap /tmp/local.png --size 1120x720
          test -s /tmp/local.png

      - name: RPM
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo build --release --locked -p crucible-lsp
          ( cd crucible-desktop && cargo build --release --locked )
          sh crucible-desktop/linux-bundle.sh
          dnf -y install crucible-desktop/target/linux/*.rpm
          code=0
          crucible-playbooks --keep </dev/null || code=$?
          test "$code" -eq 2
          test -x /usr/bin/crucible-lsp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: crucible-playbooks-rpm
          path: crucible-desktop/target/linux/*.rpm
          retention-days: 14
