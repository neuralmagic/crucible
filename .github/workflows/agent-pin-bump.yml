name: Agent pin bump

# Keeps the agent CLI pins in the image feedstock at the npm `latest` dist-tag: read each
# feature's pin, compare with the registry, rewrite the ones that moved, and open or refresh
# one PR that the merge queue lands once the PR build of the affected sandbox images is
# green. Daily, ahead of the nightly image build, so a bump lands and the rebuilt images
# carry it the same day.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve and rewrite
        id: bump
        run: |
          set -euo pipefail
          bumped=""
          bump() {
            local pin="$1" pkg="$2" file="$3"
            local old new
            old=$(sed -n "s/^${pin} = \"\([^\"]*\)\"$/\1/p" "$file")
            test -n "$old"
            new=$(curl -fsSL "https://registry.npmjs.org/${pkg}" | jq -r '."dist-tags".latest')
            test -n "$new" && [ "$new" != "null" ]
            if [ "$new" = "$old" ]; then
              echo "$pin: $old is latest"
              return
            fi
            sed -i "s/^${pin} = \"${old}\"$/${pin} = \"${new}\"/" "$file"
            echo "$pin: $old -> $new"
            bumped="${bumped:+$bumped,}${pin}:${old}:${new}"
          }
          bump claude-code @anthropic-ai/claude-code images/features/claude-code/feature.toml
          bump codex @openai/codex images/features/codex/feature.toml
          bump opencode opencode-ai images/features/opencode/feature.toml
          bump pi @earendil-works/pi-coding-agent images/features/pi/feature.toml
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          git status --short

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.bump.outputs.bumped != ''
        id: app
        with:
          app-id: ${{ secrets.CRUCIBLE_APP_ID }}
          private-key: ${{ secrets.CRUCIBLE_APP_PRIVATE_KEY }}

      - name: Open or refresh the PR
        if: steps.bump.outputs.bumped != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          BUMPED: ${{ steps.bump.outputs.bumped }}
        run: |
          set -euo pipefail
          names=$(tr ',' '\n' <<<"$BUMPED" | cut -d: -f1 | paste -sd- -)
          branch="agent-pin-bump/$names"
          title="Bump the $names pin to $(tr ',' '\n' <<<"$BUMPED" | cut -d: -f3 | paste -sd- -)"
          body=$(tr ',' '\n' <<<"$BUMPED" | awk -F: '{printf "- `%s`: `%s` -> `%s`\n", $1, $2, $3}')
          git config user.name "$BOT"
          git config user.email "$BOT@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin "$branch" 2>/dev/null && git diff --quiet "origin/$branch" -- .; then
            echo "$branch already carries this bump; nothing to refresh"
            gh pr merge "$branch" --auto --merge
            exit 0
          fi
          git checkout -b "$branch"
          git commit -qam "$title"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git push --force-with-lease origin "HEAD:$branch"
          else
            git push origin "HEAD:$branch"
          fi
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --title "$title" --body "$body"
          else
            gh pr edit "$branch" --title "$title" --body "$body"
          fi
          gh pr merge "$branch" --auto --merge
