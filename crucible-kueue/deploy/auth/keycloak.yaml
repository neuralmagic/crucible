# Keycloak (RHBK 26.6) and its Postgres in `rhbk`. Namespaced only.
#
# Secrets are not in git; create them first (README.md in this directory):
#   keycloak-db          username, password   (Postgres owner, read by both pods)
#
# Public URL: https://keycloak.apps.openshift.nm.rdu4.corp.redhat.com (edge Route below).
# In-cluster: http://keycloak-service.rhbk.svc.cluster.local:8080. Hostname is strict, so tokens
# minted over either path carry the public issuer.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: rhbk
spec:
  selector:
    app: keycloak-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db
  namespace: rhbk
spec:
  serviceName: keycloak-db
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-db
  template:
    metadata:
      labels:
        app: keycloak-db
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          env:
            - name: POSTGRESQL_DATABASE
              value: keycloak
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: lvms-control-plane-storage
        resources:
          requests:
            storage: 5Gi
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: rhbk
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db.rhbk.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: https://keycloak.apps.openshift.nm.rdu4.corp.redhat.com
    strict: true
    backchannelDynamic: false
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  features:
    enabled:
      - client-auth-federated
      - spiffe
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: rhbk
spec:
  host: keycloak.apps.openshift.nm.rdu4.corp.redhat.com
  to:
    kind: Service
    name: keycloak-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
