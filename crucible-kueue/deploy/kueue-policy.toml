# crucible-kueue tool policy (--tool-policy, optional). Rules see `claims` (the access token's)
# and `args` (the call's arguments).
#
# The tools, the scope each needs, and the Kubernetes access each needs are the server's own
# (crucible-kueue/src/access.rs). For a token carrying kube_user (a person, or a run acting as its
# launcher) every call but whoami is a SubjectAccessReview; the server acts with its own service
# account either way. Granting a person a queue is ordinary RBAC:
#
#   apiGroups: [kueue.x-k8s.io]  resources: [localqueues]  resourceNames: [<queue>]  verbs: [use]
#
# `use` is a verb only crucible-kueue asks about.

[[tools.workload_plan.validate]]
name = "queue-allowed"
rule = "!has(claims.queues) || size(claims.queues) == 0 || args.queue in claims.queues"
message = "the queue is not in this run's allowlist"

[[tools.workload_submit.validate]]
name = "queue-allowed"
rule = "!has(claims.queues) || size(claims.queues) == 0 || args.queue in claims.queues"
message = "the queue is not in this run's allowlist"

[[tools.workload_scale.validate]]
name = "replica-cap"
rule = "args.replicas >= 0 && args.replicas <= 8"
message = "replicas must be between 0 and 8"
