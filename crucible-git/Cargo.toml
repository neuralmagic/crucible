[package]
name = "crucible-git"
description = "A run's git and GitHub calls, made with its minted GitHub App token: a smart-HTTP proxy and an MCP server for pull requests."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
base64 = "0.22"
clap.workspace = true
crucible-contract = { path = "../crucible-contract" }
crucible-mcp-auth = { path = "../crucible-mcp-auth" }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "fs", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true
