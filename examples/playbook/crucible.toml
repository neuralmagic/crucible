# playbook — the one-shot, measurement-free litmus domain. No [judge]: nothing is scored,
# nothing is kept or discarded, the graph runs once. The `command` backend (role.sh) stands
# in for every agent turn, so the whole pack runs in milliseconds with no model and no cost.
#
#   crucible plan run --file examples/playbook/plan.toml \
#                     --manifest examples/playbook/crucible.toml
#
# type = "playbook" is the one workflow table a judge-free manifest takes. The graph is named,
# not carried: it compiles per run, which is what a parameterised playbook needs.

# No [repo]: the pack is the whole workspace. The engine seeds it from the injects and commits
# them as the baseline.
[workspace]
inject = ["role.sh", "shape.sh", "roundup.sh", "inbox"]

[agent]
backend   = "command"
agent_cmd = "./role.sh"
goal      = "Draft release notes from the inbox, then audit them."

[workflow]
type = "playbook"
file = "workflow.star"
