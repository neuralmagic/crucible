# FIPS early warning: per shipped (target, feature-set) variant, does the compiled dependency
# graph still resolve crypto to the system OpenSSL?
[workspace]
dir = "workspace"
setup_cmd = "mkdir -p workspace && git clone -q --depth 1 --branch \"${FIPS_WATCH_REF:-main}\" \"https://github.com/${FIPS_WATCH_REPO:-ai-dynamo/modelexpress}.git\" workspace/checkout && git -C workspace/checkout rev-parse HEAD > workspace/WATCHED_REV && rm -rf workspace/checkout/.git"

inject = ["variants.json", "blockers.json", "required.json", "file_issues.py"]

[agent]
backend = "openshell"
harness = "claude"
model = "claude-opus-4-6"
sandbox_image = "quay.io/aipcc/agentic-ci/claude-sandbox:0.3.11"
goal = "Explain why a Rust build stopped resolving crypto to the system OpenSSL, and propose the minimal fix."

[agent.openshell]
binaries = ["/usr/bin/git", "/usr/bin/cargo", "/usr/bin/curl", "/usr/bin/gh", "/usr/local/bin/gh"]

# Compiled per run from workflow.star, which declares params.
[workflow]
type = "playbook"
file = "workflow.star"
