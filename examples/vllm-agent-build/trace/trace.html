<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --flow-bg: #edebe2; --flow-surface: #ffffff; --flow-ink: #100f0e; --flow-ink-2: #464439;
  --flow-muted: #78756a; --flow-hairline: #c4c0b0; --flow-accent: #1a4785;
  --bg: var(--flow-bg); --panel: var(--flow-surface); --fg: var(--flow-ink); --muted: var(--flow-muted);
  --rule: var(--flow-hairline); --grid: color-mix(in srgb, var(--flow-hairline) 45%, transparent);
  --accent: var(--flow-accent); --remote: var(--flow-accent); --load: var(--flow-accent);
  --phase: var(--flow-ink-2); --other: var(--flow-muted);
  --miss: #b5452f; --hit: #3f7a53; --link: #6f4fa0; --quiet: #b8862b;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Ioskeley Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --flow-bg: #0a0a09; --flow-surface: #1c1c19; --flow-ink: #f5f3ea; --flow-ink-2: #adaa9d;
  --flow-muted: #7b786c; --flow-hairline: #3a3830; --flow-accent: #83afe8; color-scheme: dark } }
:root[data-theme="dark"] { --miss: #e07a5f; --hit: #79bf92; --link: #b28ce0; --quiet: #e0b04f; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; min-width: 0;
  display: flex; flex-direction: column; gap: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 13px; }
.facts b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; }
.stat .v { font: 600 22px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart { position: relative; }
canvas { display: block; width: 100%; touch-action: none; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
  padding: 6px 8px; font: 12px var(--mono); max-width: min(520px, 90%); white-space: pre-wrap; overflow-wrap: anywhere;
  box-shadow: 0 2px 10px rgb(0 0 0 / 0.15); z-index: 2; }
.hint { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
button { font: 12px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 6px; border-bottom: 1px solid var(--rule); }
td { padding: 5px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.n { text-align: right; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.p { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.targets { display: grid; grid-template-columns: minmax(100px, max-content) 1fr auto; gap: 5px 10px; align-items: center; font-size: 13px; }
.targets .name { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.bar { display: flex; height: 12px; border-radius: 2px; overflow: hidden; min-width: 0; }
.bar span { display: block; height: 100%; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title"></h1><div class="facts" id="facts"></div></header>
  <section class="stats" id="stats"></section>
  <section class="panel">
    <h2>Timeline</h2>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"><canvas id="cv" role="img" aria-label="Build timeline"></canvas><div class="tip" id="tip" hidden></div></div>
    <div class="hint"><span>Scroll to zoom, drag to pan, double-click to reset. Rows: phases, quiet stretches, jobs running at once, then each ninja job on its slot.</span><button id="reset" type="button">Reset zoom</button></div>
  </section>
  <section class="panel"><h2>Compile time by target</h2><div class="targets" id="targets"></div></section>
  <div class="grid2">
    <section class="panel"><h2>Slowest jobs</h2><div class="scroll"><table><thead><tr><th>Output</th><th>Result</th><th>Seconds</th></tr></thead><tbody id="slow"></tbody></table></div></section>
    <section class="panel"><h2>Quiet stretches</h2><div class="scroll"><table><thead><tr><th>Printed nothing after</th><th>Seconds</th></tr></thead><tbody id="quiet"></tbody></table></div></section>
  </div>
</div>
<script>
const TRACE = /*TRACE*/null;
const luminance = c => { const m = c.match(/\d+(\.\d+)?/g); if (!m) return 1; const [r, g, b] = m.slice(0, 3).map(Number); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };
const probe = document.createElement("div"); probe.style.color = "var(--flow-bg)"; document.body.append(probe);
if (luminance(getComputedStyle(probe).color) < 0.4) document.documentElement.dataset.theme = "dark";
probe.remove();
const KIND_LABEL = { miss: "compiled", "remote-hit": "shared ccache", hit: "local ccache", link: "link", other: "other", unknown: "compiled (no ccache record)" };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const kindColor = k => css({ miss: "--miss", unknown: "--miss", hit: "--hit", "remote-hit": "--remote", link: "--link" }[k] || "--other");
const fmt = s => s == null ? "–" : s >= 100 ? s.toFixed(0) : s >= 10 ? s.toFixed(1) : s.toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const od = TRACE.otherData || {};
const ev = TRACE.traceEvents.filter(e => e.ph === "X" || e.ph === "i");
const phases = ev.filter(e => e.pid === 1);
const jobs = ev.filter(e => e.pid === 2);
const quiet = ev.filter(e => e.pid === 3 && e.cat === "quiet");
const lines = ev.filter(e => e.pid === 3 && e.ph === "i");
const end = Math.max(1, ...ev.map(e => e.ts + (e.dur || 0)));
const lanes = Math.max(0, ...jobs.map(j => j.tid));
const edges = jobs.flatMap(j => [[j.ts, 1], [j.ts + j.dur, -1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
let running = 0; const load = edges.map(([t, d]) => [t, running += d]);
const first = edges.length ? edges[0][0] : 0, last = edges.length ? edges[edges.length - 1][0] : 0;
const busy = jobs.reduce((a, j) => a + j.dur, 0);
const halfAt = load.findLast(([, k]) => k >= lanes / 2);
const count = k => jobs.filter(j => j.cat === k).length;

document.title = od.title || document.title;
document.getElementById("title").textContent = od.title || "Build trace";
const factKeys = Object.keys(od).filter(k => !["title", "phases_s", "ninja", "quiet", "facts"].includes(k) && typeof od[k] !== "object");
document.getElementById("facts").innerHTML = factKeys.map(k => `<span>${esc(k)} <b>${esc(od[k])}</b></span>`).join("");
const stat = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
document.getElementById("stats").innerHTML = [
  stat(fmt((last - first) / 1e6) + " s", "ninja wall time"),
  stat(jobs.length, "jobs"),
  stat(count("miss") + count("unknown"), "compiled"),
  stat(count("remote-hit"), "shared ccache hits"),
  stat(count("hit"), "local ccache hits"),
  stat(lanes ? Math.round(100 * busy / (lanes * Math.max(1, last - first))) + "%" : "–", `slot use (${lanes} slots)`),
  stat(halfAt ? fmt((last - halfAt[0]) / 1e6) + " s" : "–", "tail under half the slots"),
].join("");
const shown = ["miss", "remote-hit", "hit", "link", "other"].filter(k => count(k) || (k === "miss" && count("unknown")));
document.getElementById("legend").innerHTML = shown.map(k => `<span><i style="background:${kindColor(k)}"></i>${KIND_LABEL[k]}</span>`).join("")
  + (phases.length ? `<span><i style="background:${css("--phase")}"></i>phase</span>` : "")
  + (quiet.length ? `<span><i style="background:${css("--quiet")}"></i>quiet</span>` : "");

const targetOf = out => { const m = out.match(/(?:^|\/)CMakeFiles\/([^/]+)\.dir\//); if (m) return m[1]; const so = out.match(/([^/]+?)(?:\.abi3)?\.(?:so|dylib|dll)$/); return so ? so[1] : "other outputs"; };
const by = new Map();
jobs.forEach(j => { const t = targetOf(j.args.output), e = by.get(t) || { name: t, total: 0, n: 0, kinds: {} }; e.total += j.dur / 1e6; e.n++; e.kinds[j.cat] = (e.kinds[j.cat] || 0) + j.dur / 1e6; by.set(t, e); });
const targets = [...by.values()].sort((a, b) => b.total - a.total).slice(0, 16), topT = targets[0]?.total || 1;
document.getElementById("targets").innerHTML = targets.length ? targets.map(t => `<span class="name">${esc(t.name)}</span><div class="bar">${Object.entries(t.kinds).map(([k, v]) => `<span title="${esc(KIND_LABEL[k] || k)} ${fmt(v)} s" style="width:${(100 * v / topT).toFixed(2)}%;background:${kindColor(k)}"></span>`).join("")}</div><span class="n" style="font-family:var(--mono);color:var(--muted)">${fmt(t.total)} s · ${t.n}</span>`).join("") : `<span class="empty">No ninja jobs.</span>`;
document.getElementById("slow").innerHTML = [...jobs].sort((a, b) => b.dur - a.dur).slice(0, 20).map(j => `<tr><td class="p">${esc(j.args.output)}</td><td><span class="sw" style="background:${kindColor(j.cat)}"></span>${esc(KIND_LABEL[j.cat] || j.cat)}</td><td class="n">${fmt(j.dur / 1e6)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">No ninja jobs.</td></tr>`;
document.getElementById("quiet").innerHTML = (od.quiet || []).map(q => `<tr><td class="p">${esc(q.after)}</td><td class="n">${fmt(q.s)}</td></tr>`).join("") || `<tr><td colspan="2" class="empty">No output timings in this trace.</td></tr>`;

const cv = document.getElementById("cv"), tip = document.getElementById("tip"), chart = document.getElementById("chart");
const AXIS = 22, ROW = 18, LOAD_H = 46, GAP = 8;
let view = [0, end], hits = [], drag = null;
function layout() {
  const laneH = lanes ? Math.max(3, Math.min(9, Math.floor(460 / lanes))) : 0;
  let y = AXIS; const rows = {};
  if (phases.length) { rows.phase = y; y += ROW + GAP; }
  if (quiet.length || lines.length) { rows.quiet = y; y += 14 + GAP; }
  if (jobs.length) { rows.load = y; y += LOAD_H + GAP; }
  rows.jobs = y;
  return { laneH, rows, h: y + lanes * laneH + 8 };
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 5, 10].map(m => m * p).find(v => v >= raw) || 10 * p; }
function draw() {
  const w = chart.clientWidth, L = layout(), dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = L.h * dpr; cv.style.height = L.h + "px";
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, L.h);
  const [t0, t1] = view, x = t => (t - t0) / (t1 - t0) * w;
  hits = []; g.font = "11px " + css("--mono"); g.textBaseline = "middle";
  const step = niceStep((t1 - t0) / 1e6 / Math.max(2, w / 110));
  g.strokeStyle = css("--grid"); g.fillStyle = css("--muted"); g.lineWidth = 1;
  for (let s = Math.ceil(t0 / 1e6 / step) * step; s * 1e6 <= t1; s += step) {
    const px = Math.round(x(s * 1e6)) + .5; g.beginPath(); g.moveTo(px, AXIS - 4); g.lineTo(px, L.h); g.stroke(); g.fillText(fmt(s) + "s", px + 3, AXIS / 2);
  }
  if (L.rows.phase !== undefined) phases.forEach(p => {
    const x0 = x(p.ts), x1 = x(p.ts + p.dur); g.fillStyle = css("--phase"); g.fillRect(x0, L.rows.phase, Math.max(1, x1 - x0), ROW);
    if (x1 - x0 > 40) { g.fillStyle = css("--panel"); g.fillText(p.name, Math.max(x0, 0) + 4, L.rows.phase + ROW / 2); }
    hits.push({ x0, x1, y0: L.rows.phase, y1: L.rows.phase + ROW, text: `${p.name}  ${fmt(p.dur / 1e6)} s` });
  });
  if (L.rows.quiet !== undefined) {
    const qy = L.rows.quiet;
    lines.forEach(l => { const px = x(l.ts); if (px >= 0 && px <= w) { g.fillStyle = css("--muted"); g.fillRect(px, qy + 3, 1, 8); } });
    quiet.forEach(q => { const x0 = x(q.ts), x1 = x(q.ts + q.dur); g.fillStyle = css("--quiet"); g.fillRect(x0, qy, Math.max(1, x1 - x0), 14);
      hits.push({ x0, x1, y0: qy, y1: qy + 14, text: `quiet ${fmt(q.dur / 1e6)} s after:\n${q.args.after}` }); });
  }
  if (L.rows.load !== undefined) {
    const ly = L.rows.load, base = ly + LOAD_H, k = n => base - n / Math.max(1, lanes) * LOAD_H;
    g.fillStyle = css("--grid"); g.fillRect(0, ly, w, LOAD_H);
    g.beginPath(); g.moveTo(x(load[0][0]), base); let prev = 0;
    load.forEach(([t, n]) => { const px = x(t); g.lineTo(px, k(prev)); g.lineTo(px, k(n)); prev = n; });
    g.lineTo(x(load[load.length - 1][0]), base); g.closePath();
    g.globalAlpha = 0.35; g.fillStyle = css("--load"); g.fill(); g.globalAlpha = 1; g.strokeStyle = css("--load"); g.stroke();
    g.fillStyle = css("--muted"); g.fillText(`${lanes} slots`, 4, ly + 8);
    hits.push({ x0: 0, x1: w, y0: ly, y1: base, load: true });
  }
  jobs.forEach(j => {
    const x0 = x(j.ts), x1 = x(j.ts + j.dur), y = L.rows.jobs + (j.tid - 1) * L.laneH;
    if (x1 < 0 || x0 > w) return;
    g.fillStyle = kindColor(j.cat); g.fillRect(x0, y, Math.max(1, x1 - x0), Math.max(1, L.laneH - 1));
    hits.push({ x0, x1: Math.max(x0 + 2, x1), y0: y, y1: y + L.laneH, text: `${j.args.output}\n${KIND_LABEL[j.cat] || j.cat} · ${fmt(j.dur / 1e6)} s · starts ${fmt(j.ts / 1e6)} s` });
  });
}
function clamp(a, span) { a = Math.max(0, Math.min(a, end - span)); return [a, a + span]; }
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(), f = (e.clientX - r.left) / r.width, [t0, t1] = view, span = t1 - t0;
  const ns = Math.min(end, Math.max(2e4, span * Math.exp(e.deltaY * 0.0015))); view = clamp(t0 + f * span - f * ns, ns); draw(); }, { passive: false });
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, v: [...view] }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect();
  if (drag) { const span = drag.v[1] - drag.v[0]; view = clamp(drag.v[0] - (e.clientX - drag.x) / r.width * span, span); draw(); }
  const mx = e.clientX - r.left, my = e.clientY - r.top, h = hits.findLast(h => mx >= h.x0 && mx <= h.x1 && my >= h.y0 && my <= h.y1);
  if (h && !drag) { const t = view[0] + mx / r.width * (view[1] - view[0]);
    tip.textContent = h.load ? `${(load.findLast(([u]) => u <= t) || [0, 0])[1]} of ${lanes} slots busy at ${fmt(t / 1e6)} s` : h.text;
    tip.hidden = false; tip.style.left = Math.max(0, Math.min(mx + 12, r.width - tip.offsetWidth - 4)) + "px"; tip.style.top = (my + 14) + "px"; }
  else tip.hidden = true;
});
cv.addEventListener("pointerup", () => { drag = null; });
cv.addEventListener("pointerleave", () => { tip.hidden = true; });
cv.addEventListener("dblclick", () => { view = [0, end]; draw(); });
document.getElementById("reset").addEventListener("click", () => { view = [0, end]; draw(); });
new ResizeObserver(draw).observe(chart);
</script>
</body>
</html>
