# Run with `prek run --all-files` (or `just hooks`). `prek install` wires it to git commit.
repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]

      - id: dsl-docs
        name: regenerate the workflow DSL reference
        entry: scripts/dsl-docs.sh
        language: system
        pass_filenames: false
        files: ^(crucible/src/plan/starlark|docs/dsl-reference\.md)
      - id: loop-docs
        name: regenerate the loop control states page
        entry: scripts/loop-docs.sh
        language: system
        pass_filenames: false
        files: ^(crucible/src/runloop/machine\.rs|docs/loop-states\.md|docs/img/loop-states\.(dot|svg))

      - id: gov-render
        name: render RFCs from the governance SSOT
        entry: govctl render rfc
        language: system
        pass_filenames: false
        files: ^(gov/rfc/|docs/rfc/)

      - id: typed-error-ratchet
        name: no new stringly-error modules
        entry: scripts/typed-error-ratchet.sh
        language: system
        pass_filenames: false
        types: [rust]
