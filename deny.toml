# cargo-deny policy for the public repo (ci.yml's audit job runs `cargo deny check`).
# Baseline posture: strict on licenses and dependency sources, advisories fail the build,
# version-duplication bans stay off (tools/check-dep-dups.sh owns that guard with a snapshot).

[graph]
all-features = true

[advisories]
# cargo-deny v2 semantics: any advisory (vulnerability/unsound/unmaintained) is an error
# unless explicitly ignored here with a reason.
version = 2
yanked = "warn"
# Triaged baseline (2026-07-28): the advisories already present in the exported graph, ignored
# with reasons so the job starts green and any NEW advisory fails the build. Re-triage on dep
# bumps and shrink this list.
ignore = [
    # rustls-webpki 0.101.x via the aws-sdk legacy hyper-rustls 0.24 stack. Server-side use
    # only (S3 client to a fixed endpoint); superseded generation already present alongside.
    { id = "RUSTSEC-2026-0098", reason = "legacy aws-sdk rustls stack; fixed-endpoint S3 client, not a general TLS verifier" },
    { id = "RUSTSEC-2026-0099", reason = "legacy aws-sdk rustls stack; fixed-endpoint S3 client, not a general TLS verifier" },
    { id = "RUSTSEC-2026-0104", reason = "legacy aws-sdk rustls stack; fixed-endpoint S3 client, not a general TLS verifier" },
    # anyhow Error::downcast_mut unsoundness; no downcast_mut use in this workspace.
    { id = "RUSTSEC-2026-0190", reason = "workspace does not call Error::downcast_mut" },
    # Font parsing reached only through the vendored mermaid renderer (third_party/,
    # xai-grok-mermaid -> resvg -> usvg). Unmaintained, no fix available upstream. It parses
    # fonts we ship to rasterize our own generated SVG, never untrusted input.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via the vendored mermaid renderer; renders our own SVG, no untrusted input" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via the vendored mermaid renderer; renders our own SVG, no untrusted input" },
    # Unmaintained crates internal to starlark-rust (starlark_map/starlark_syntax); no upstream
    # fix. They serve interpreter-internal hashing and derives, not a security boundary.
    { id = "RUSTSEC-2025-0057", reason = "fxhash via starlark_map; interpreter-internal hashing, not a security boundary" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via starlark_syntax's postcard/heapless; interpreter-internal" },
    { id = "RUSTSEC-2024-0388", reason = "derivative proc-macro via starlark_syntax; compile-time only" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# ring's license file is the historical OpenSSL/ISC/MIT aggregate; declare it so the checker
# doesn't have to guess.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate-version policing lives in tools/check-dep-dups.sh (snapshot-based, targeted at the
# http/tls cluster); keep cargo-deny's blanket ban off so the two guards don't fight.
multiple-versions = "allow"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # The OpenShell fork pin: the gateway's native gRPC clients + auth interceptor, one pin
    # for every crate that talks to the gateway.
    "https://github.com/wseaton/OpenShell",
    # The broker's pinned jira-mcp dep.
    "https://github.com/wseaton/jira-mcp",
]
