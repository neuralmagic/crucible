[workspace]
members = [
    "crucible",
    "crucible-contract",
    "crucible-vcs",
    "crucible-harness",
    "crucible-broker",
    "forge",
    "crucible-controller",
    "crux",
    "crucible-kueue",
    "crucible-mcp-auth",
    "buildit",
    "capability",
    "xtask",
]
# Vendored upstream sources (see third_party/NOTICE). Excluded from the workspace so
# `cargo fmt --all` / clippy lint our code and leave theirs byte-identical to upstream;
# they are still consumed as path dependencies.
exclude = ["third_party/dagre_rust", "third_party/graphlib_rust", "third_party/mermaid-to-svg", "third_party/ordered_hashmap", "third_party/xai-grok-mermaid"]
resolver = "3"

[workspace.package]
version = "0.5.1"
# Dual-licensed like the repo (LICENSE-MIT / LICENSE-APACHE); the public export's cargo-deny
# licenses check requires every workspace crate to declare it.
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost-types = "0.14.4"
clap = { version = "4", features = ["derive", "env"] }
git2 = "0.21"
jiff = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
# Scenario issue keys (`scenario:{uuidv7}`, controller adopt endpoint): v7 is lexicographically
# sortable and timestamp-derived, unlike v4's pure randomness.
uuid = { version = "1", features = ["v7"] }
# The OpenShell gateway's native gRPC clients + auth interceptor — one pin for every crate that
# talks to the gateway (engine + broker), so the two can never link different protos.
openshell-core = { git = "https://github.com/wseaton/OpenShell.git", rev = "5097812377b46afd8327c702e1bc1b58e68e49d6", default-features = false }
# Same rev as openshell-core: the sandbox filesystem defaults (/dev/null, /usr, /etc ...) live here,
# and crucible extends them rather than restating them.
openshell-policy = { git = "https://github.com/wseaton/OpenShell.git", rev = "5097812377b46afd8327c702e1bc1b58e68e49d6", default-features = false }
tonic = { version = "0.14", features = ["channel", "tls-native-roots", "tls-ring"] }
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
# Cron expression parsing for playbook schedules. Owns the pattern grammar only: it matches
# civil fields as integers, so jiff stays the single timezone authority. Default features off
# drops croner's chrono backend.
croner = { version = "4", default-features = false }
# Launch-time validation of playbook param values against the pack's stored params schema. The
# de-facto Rust validator; `default-features = false` keeps remote `$ref` resolution off, so a
# stored schema can never make the controller fetch a URL.
jsonschema = { version = "0.59", default-features = false }
moka = { version = "0.12", features = ["sync", "future"] }
url = "2"
# One Kubernetes client and API pin for every crate that talks to a cluster, so the engine,
# controller, forge, and crucible-kueue never link two kube stacks. Members add features.
kube = { version = "4.0", default-features = false }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
percent-encoding = "2"
# CEL for MCP tool policy, at the controller's pin.
cel = { git = "https://github.com/cel-rust/cel-rust", rev = "92f4376e200124e8dbafe5323a69cbe6bc3765c6" }

[profile.release]
opt-level = 2
