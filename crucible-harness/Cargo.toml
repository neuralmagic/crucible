[package]
name = "crucible-harness"
description = "The agent harness: the stream-json decoder, the in-process OTLP collector (live token rate + otel_summary rollup), and the OTEL env injection. Depends on crucible-contract for the wire types; nothing controller-shaped."
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
serde_json.workspace = true
jiff.workspace = true
# axum 0.8 is the workspace's shared HTTP server, so no new heavy dep enters the tree.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The collector owns a current-thread runtime on its own thread; async never leaks into the loop.
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
crucible-contract = { path = "../crucible-contract" }
