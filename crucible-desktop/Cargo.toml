[package]
name = "crucible-playbooks"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, like crucible-desktop: Rune is pre-release and pinned to a dev rev, so the
# engine workspace must not inherit it. Rune itself is ../vendor/rune, upstream at that rev plus
# patches/rune, which rune-patches.sh lays down.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { path = "../vendor/rune/crates/rune" }
rune-kit = { path = "../vendor/rune/crates/rune-kit", default-features = false, features = ["markdown", "mermaid"] }
rune-mermaid = { path = "../vendor/rune/crates/rune-mermaid" }
rune-theme-opencode = { path = "../vendor/rune/themes/opencode" }
rune-mac = { path = "../vendor/rune/crates/rune-mac" }
rune-knobs = { path = "../vendor/rune/crates/rune-knobs" }
crucible-contract = { path = "../crucible-contract" }
crucible-view = { path = "../crucible-view" }
crux = { path = "../crux", default-features = false }
tokio = { version = "1", features = ["sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
base64 = "0.23"
sha2 = "0.10"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false }
futures-util = "0.3"
url = "2"
toml = "0.8"
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "auto-dispatch", "simd"] }
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crucible = { path = "../crucible", default-features = false }
crucible-harness = { path = "../crucible-harness" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["socks"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rune-fx = { path = "../vendor/rune/crates/rune-fx" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
keyring = "4"
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
libc = "0.2"
rand = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
jiff = { version = "0.2", features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSObject", "NSThread"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "objc2-app-kit", "objc2-core-foundation"] }
raw-window-handle = "0.6"
thiserror = "2"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }

[dev-dependencies]
tempfile = "3"
wasmi = { version = "2", default-features = false, features = ["wat"] }

[features]
hot = ["rune/hot"]
# The ⌘⇧K panel that tunes effects and layout live. Off, every knob reads its default.
knobs = ["rune-knobs/panel"]

[patch.crates-io]
accesskit_macos = { path = "../vendor/rune/vendor/accesskit_macos" }
accesskit_windows = { path = "../vendor/rune/vendor/accesskit_windows" }
parley_engine = { path = "../vendor/rune/vendor/parley_engine" }
sctk-adwaita = { path = "../vendor/rune/vendor/sctk-adwaita" }
wgpu-hal = { path = "../vendor/rune/vendor/wgpu-hal" }
winit = { path = "../vendor/rune/vendor/winit" }
